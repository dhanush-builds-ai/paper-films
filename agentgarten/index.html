<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentGarten: Code Worlds for Evolving Agents · paper film</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&amp;family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
html,body{height:100%}
#film{height:100vh}
body{margin:0}
button{cursor:pointer;font-family:inherit}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes plpulse{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes plflow{to{stroke-dashoffset:-26}}
@keyframes plblink{0%,100%{opacity:.15}50%{opacity:1}}
.h{font-family:'Newsreader',serif}
.mono{font-family:'IBM Plex Mono',monospace}
.btn{height:34px;padding:0 13px;border-radius:8px;border:1px solid var(--rule);background:var(--card);font-size:13.5px;color:var(--ink)}
.seg{height:100%;border:none;padding:0;background:transparent;border-right:2px solid var(--card)}
.seg:hover{background:rgba(0,0,0,.08)}
.chap{height:32px;padding:0 12px;border-radius:999px;font-size:13px;white-space:nowrap}
</style>
</head>
<body>
<div id="film"></div>
<template id="film-tpl">
<div style="--bg: {{t.bg}}; --card: {{t.card}}; --ink: {{t.ink}}; --muted: {{t.muted}}; --label: {{t.label}}; --rule: {{t.rule}}; --acc: {{accent}}; --accsoft: {{accSoft}}; width: 100%; height: 100%; min-height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; background: {{t.page}}; color: var(--ink); font-family: 'IBM Plex Sans', sans-serif; padding: 14px 24px 16px; overflow: hidden">

<div data-topbar="1" style="flex-shrink: 0; display: flex; align-items: flex-end; gap: 20px; padding: 4px 4px 0; min-width: 0">
<div data-papertitle="1" style="min-width: 0; flex: 1 1 auto">
<div class="h" style="font-size: 26px; line-height: 1.2; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{meta.title}}</div>
<div style="margin-top: 5px; font-size: 14px; line-height: 1.3; color: var(--label); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{meta.line}}</div>
</div>
<div style="display: flex; gap: 8px; flex-shrink: 0; padding-bottom: 2px">
<sc-for list="{{meta.links}}" as="lk" hint-placeholder-count="2"><a href="{{lk.u}}" target="_blank" rel="noopener" style="height: 32px; display: inline-flex; align-items: center; padding: 0 14px; border-radius: 999px; border: 1px solid var(--rule); background: var(--card); color: var(--acc); font-size: 13.5px; text-decoration: none">{{lk.t}} ↗</a></sc-for>
</div>
</div>
<div data-chips="1" style="flex-shrink: 0; min-width: 0; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; margin: 14px 0 10px; padding: 0 4px">
<div style="display: flex; gap: 6px; width: max-content">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="8"><button class="chap" onClick="{{c.pick}}" style="border: 1px solid {{c.bd}}; background: {{c.bg}}; color: {{c.fg}}; font-weight: {{c.fw}}"><span class="mono" style="font-size: 11px; opacity: .7; margin-right: 6px">{{c.n}}</span>{{c.name}}</button></sc-for>
</div>
</div>

<div id="{{pid}}-holder" style="flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 6px 0 22px">
<div style="position: relative; width: {{stW}}px; height: {{stH}}px; flex-shrink: 0">
<div data-stage="1" style="--tf: {{tf}}; position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform: scale({{scale}}); transform-origin: 0 0; background: var(--card); border-radius: 22px; outline: 1px solid {{t.edge}}; box-shadow: 0 1px 2px {{t.shSoft}}, 0 6px 16px -6px {{t.shSoft}}, 0 24px 48px -12px {{t.sh}}, 0 60px 90px -40px {{t.shDeep}}; overflow: hidden">

<sc-for list="{{scenes}}" as="sc" hint-placeholder-count="6">
<div data-scene="1" style="position: absolute; inset: 0; opacity: {{sc.op}}; transition: opacity calc(.7s * var(--tf)) ease; pointer-events: {{sc.pe}}">

<div style="position: absolute; left: 0; right: 0; top: 0; height: 196px; background: {{t.band}}; border-bottom: 1px solid {{t.rule}}; opacity: {{sc.band}}"></div>
<div class="mono" style="position: absolute; left: 48px; top: 26px; font-size: 13px; letter-spacing: .08em; color: var(--acc); text-transform: uppercase">{{sc.tag}}</div>
<div data-headline="1" class="h" style="position: absolute; left: 48px; top: 46px; width: 1000px; font-size: 34px; line-height: 1.12; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{sc.title}}</div>
<div style="position: absolute; right: 48px; top: 32px; display: flex; gap: 6px; align-items: center">
<sc-for list="{{sc.dots}}" as="dt" hint-placeholder-count="6"><button onClick="{{dt.pick}}" aria-label="Beat {{dt.no}}" style="width: {{dt.w}}px; height: 8px; border-radius: 4px; border: none; padding: 0; background: {{dt.bg}}; transition: width calc(.4s * var(--tf)), background calc(.4s * var(--tf))"></button></sc-for>
</div>

<sc-for list="{{sc.actors}}" as="a" hint-placeholder-count="12">
<div data-actor="{{a.id}}" data-type="{{a.type}}" style="position: absolute; left: 0; top: 0; width: {{a.w}}px; transform: translate({{a.x}}px, {{a.y}}px) scale({{a.s}}); transform-origin: 0 0; opacity: {{a.op}}; transition: transform calc(1.2s * var(--tf)) cubic-bezier(.45,0,.2,1) calc({{a.dl}}s * var(--tf)), opacity calc(.8s * var(--tf)) ease calc({{a.dl}}s * var(--tf))">
<sc-if value="{{a.isSvg}}" hint-placeholder-val="{{ false }}">
<div style="position: relative; width: {{a.w}}px; height: {{a.h}}px; animation: {{a.anim}}">
<svg width="{{a.w}}" height="{{a.h}}" viewBox="0 0 {{a.w}} {{a.h}}" style="overflow: visible; display: block">
<sc-for list="{{a.prims}}" as="q" hint-placeholder-count="8">
<sc-if value="{{q.isRect}}" hint-placeholder-val="{{ false }}"><rect x="{{q.x}}" y="{{q.y}}" width="{{q.w}}" height="{{q.h}}" rx="{{q.rx}}" style="fill: {{q.fill}}; stroke: {{q.stroke}}; stroke-width: {{q.sw}}; stroke-dasharray: {{q.dash}}; opacity: {{q.op}}; animation: {{q.anim}}; transition: fill calc(.8s * var(--tf)) ease calc({{q.tdl}}s * var(--tf)), stroke calc(.8s * var(--tf)) ease calc({{q.tdl}}s * var(--tf)), opacity calc(.8s * var(--tf)) ease calc({{q.tdl}}s * var(--tf))"></rect></sc-if>
<sc-if value="{{q.isPath}}" hint-placeholder-val="{{ false }}"><path d="{{q.d}}" transform="{{q.tf}}" style="fill: {{q.fill}}; stroke: {{q.stroke}}; stroke-width: {{q.sw}}; stroke-dasharray: {{q.dash}}; stroke-linecap: round; stroke-linejoin: round; opacity: {{q.op}}; animation: {{q.anim}}; transition: opacity calc(.8s * var(--tf)) ease calc({{q.tdl}}s * var(--tf)), stroke calc(.8s * var(--tf)) ease, fill calc(.8s * var(--tf)) ease, d calc(.9s * var(--tf)) ease"></path></sc-if>
<sc-if value="{{q.isCirc}}" hint-placeholder-val="{{ false }}"><circle cx="{{q.cx}}" cy="{{q.cy}}" r="{{q.r}}" style="fill: {{q.fill}}; stroke: {{q.stroke}}; stroke-width: {{q.sw}}; opacity: {{q.op}}; animation: {{q.anim}}; transition: fill calc(.8s * var(--tf)) ease, opacity calc(.8s * var(--tf)) ease"></circle></sc-if>
<sc-if value="{{q.isPoly}}" hint-placeholder-val="{{ false }}"><polyline points="{{q.pts}}" style="fill: {{q.fill}}; stroke: {{q.stroke}}; stroke-width: {{q.sw}}; stroke-dasharray: {{q.dash}}; stroke-linecap: round; stroke-linejoin: round; opacity: {{q.op}}; animation: {{q.anim}}"></polyline></sc-if>
</sc-for>
</svg>
<sc-for list="{{a.labels}}" as="lb" hint-placeholder-count="4"><div data-lbl="1" style="position: absolute; left: {{lb.x}}px; top: {{lb.y}}px; transform: translateX({{lb.tx}}%); white-space: nowrap; line-height: 1; font-size: {{lb.fs}}px; font-weight: {{lb.fw}}; font-family: {{lb.font}}; color: {{lb.fill}}; opacity: {{lb.op}}; transition: opacity calc(.8s * var(--tf)) ease calc({{lb.tdl}}s * var(--tf)), color calc(.8s * var(--tf)) ease; pointer-events: none">{{lb.txt}}</div></sc-for>
</div>
</sc-if>
<sc-if value="{{a.isText}}" hint-placeholder-val="{{ false }}">
<div style="width: {{a.w}}px; font-size: {{a.fs}}px; font-weight: {{a.fw}}; font-family: {{a.font}}; font-style: {{a.fst}}; line-height: {{a.lh}}; color: {{a.color}}; text-align: {{a.align}}; background: {{a.bg}}; padding: {{a.pad}}; border-radius: {{a.rad}}; border: {{a.bd}}; box-sizing: border-box"><sc-for list="{{a.segs}}" as="sg" hint-placeholder-count="3"><span style="color: {{sg.c}}; font-weight: {{sg.fw}}">{{sg.t}}</span></sc-for></div>
</sc-if>
<sc-if value="{{a.isStat}}" hint-placeholder-val="{{ false }}">
<div style="width: {{a.w}}px; box-sizing: border-box; padding: 20px 22px; border-radius: 18px; background: {{a.bg}}; border: 1px solid {{a.bd}}">
<div class="h" style="font-size: {{a.fs}}px; color: {{a.c}}; line-height: 1; font-weight: 500">{{a.v}}</div>
<div style="font-size: 17px; color: var(--label); margin-top: 10px; line-height: 1.35">{{a.l}}</div>
</div>
</sc-if>
<sc-if value="{{a.isTable}}" hint-placeholder-val="{{ false }}">
<div style="width: {{a.w}}px; font-size: {{a.fs}}px; line-height: 1.35">
<div style="display: grid; grid-template-columns: {{a.cols}}; gap: 0 18px; padding: 0 14px 10px; border-bottom: 2px solid var(--ink); font-weight: 600; color: var(--label); font-size: {{a.hfs}}px"><sc-for list="{{a.head}}" as="hc" hint-placeholder-count="4"><div style="text-align: {{hc.al}}">{{hc.t}}</div></sc-for></div>
<sc-for list="{{a.rows}}" as="r" hint-placeholder-count="5"><div style="display: grid; grid-template-columns: {{a.cols}}; gap: 0 18px; padding: {{a.rpad}}px 14px; border-bottom: 1px solid var(--rule); background: {{r.bg}}; opacity: {{r.op}}; transition: opacity calc(.6s * var(--tf)) ease, background calc(.6s * var(--tf)) ease"><sc-for list="{{r.cells}}" as="c" hint-placeholder-count="4"><div style="text-align: {{c.al}}; font-weight: {{c.fw}}; color: {{c.c}}; font-family: {{c.font}}">{{c.t}}</div></sc-for></div></sc-for>
</div>
</sc-if>
<sc-if value="{{a.isBars}}" hint-placeholder-val="{{ false }}">
<div style="width: {{a.w}}px">
<div style="font-size: {{a.tfs}}px; font-weight: 600; margin-bottom: 4px">{{a.title}}</div>
<div style="font-size: 14px; color: var(--muted); margin-bottom: 10px">{{a.sub}}</div>
<sc-for list="{{a.rows}}" as="r" hint-placeholder-count="4"><div style="display: grid; grid-template-columns: {{a.lw}}px minmax(0, 1fr) {{a.vw}}px; align-items: center; gap: 12px; margin: {{a.gap}}px 0; opacity: {{r.op}}; transition: opacity calc(.5s * var(--tf)) ease"><div style="font-size: {{a.fs}}px; color: var(--label); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.n}}</div><div style="position: relative; height: {{a.bh}}px; border-radius: 6px; background: var(--bg); overflow: hidden"><div style="position: absolute; left: 0; top: 0; bottom: 0; width: {{r.w}}%; border-radius: 6px; background: {{r.c}}; transition: width calc(1.1s * var(--tf)) cubic-bezier(.3,0,.2,1) calc({{r.dl}}s * var(--tf))"></div></div><div class="mono" style="font-size: {{a.fs}}px; font-weight: {{r.fw}}; color: {{r.vc}}">{{r.l}}</div></div></sc-for>
</div>
</sc-if>
<sc-if value="{{a.isList}}" hint-placeholder-val="{{ false }}">
<div style="width: {{a.w}}px">
<sc-if value="{{a.hasTitle}}" hint-placeholder-val="{{ false }}"><div style="font-size: {{a.tfs}}px; font-weight: 600; color: {{a.tc}}; margin-bottom: 14px">{{a.title}}</div></sc-if>
<sc-for list="{{a.items}}" as="it" hint-placeholder-count="4"><div style="display: flex; gap: 14px; align-items: flex-start; margin: 0 0 {{a.gap}}px; opacity: {{it.op}}; transform: translateX({{it.dx}}px); transition: opacity calc(.6s * var(--tf)) ease calc({{it.dl}}s * var(--tf)), transform calc(.6s * var(--tf)) ease calc({{it.dl}}s * var(--tf))"><div style="flex-shrink: 0; width: {{a.mk}}px; height: {{a.mk}}px; margin-top: {{a.mt}}px; border-radius: 50%; background: {{it.mbg}}; color: {{it.mc}}; border: {{it.mbd}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: {{a.mfs}}px; font-weight: 600">{{it.m}}</div><div style="min-width: 0"><div style="font-size: {{a.fs}}px; font-weight: {{a.tfw}}; line-height: 1.32">{{it.t}}</div><sc-if value="{{it.hasS}}" hint-placeholder-val="{{ false }}"><div style="font-size: {{a.sfs}}px; color: var(--muted); line-height: 1.4; margin-top: 4px">{{it.s}}</div></sc-if></div></div></sc-for>
</div>
</sc-if>
</div>
</sc-for>

<sc-for list="{{sc.caps}}" as="cp" hint-placeholder-count="5">
<div data-cap="1" style="position: absolute; left: 48px; top: {{sc.capTop}}px; width: 1184px; font-size: 23px; line-height: 1.38; opacity: {{cp.op}}; transform: translateY({{cp.dy}}px); transition: opacity calc(.5s * var(--tf)) ease, transform calc(.5s * var(--tf)) ease"><sc-for list="{{cp.segs}}" as="sg" hint-placeholder-count="3"><span style="color: {{sg.c}}; font-weight: {{sg.fw}}">{{sg.t}}</span></sc-for><span class="mono" style="display: inline-block; vertical-align: 3px; margin-left: 12px; font-size: 13px; padding: 2px 9px; border-radius: 6px; border: {{cp.cbd}}; color: {{cp.cfg}}; opacity: {{cp.cop}}">{{cp.chip}}</span></div>
</sc-for>

</div>
</sc-for>

</div>
</div>
</div>

<div style="flex-shrink: 0; margin-top: 14px; height: 50px; display: flex; align-items: center; gap: 12px">
<button onClick="{{pl.toggle}}" aria-label="{{pl.playLabel}}" style="width: 46px; height: 46px; flex-shrink: 0; border-radius: 50%; border: none; background: var(--acc); color: #FFFFFF; font-size: 15px">{{pl.icon}}</button>
<button class="btn" onClick="{{pl.prev}}" aria-label="Previous" style="width: 36px; padding: 0; flex-shrink: 0">⏮</button>
<button class="btn" onClick="{{pl.next}}" aria-label="Next" style="width: 36px; padding: 0; flex-shrink: 0">⏭</button>
<div style="flex: 1; min-width: 0; padding: 0 6px">
<div style="display: flex; justify-content: space-between; gap: 16px; font-size: 12.5px; margin-bottom: 7px"><span style="font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{pl.label}}</span><span class="mono" style="color: var(--muted); white-space: nowrap">{{pl.time}}</span></div>
<div style="position: relative; height: 10px; border-radius: 5px; background: {{t.track}}; overflow: hidden">
<div style="position: absolute; left: 0; top: 0; bottom: 0; width: {{pl.w}}%; background: var(--acc); transition: width {{pl.tr}}s linear"></div>
<div style="position: absolute; inset: 0; display: flex">
<sc-for list="{{pl.segs}}" as="sg" hint-placeholder-count="8"><button class="seg" onClick="{{sg.pick}}" aria-label="Jump to {{sg.name}}" title="{{sg.name}}" style="flex-grow: {{sg.w}}"></button></sc-for>
</div>
</div>
</div>
<div style="display: flex; align-items: center; gap: 4px; flex-shrink: 0">
<div style="position: relative">
<button onClick="{{pl.toggleSpeed}}" aria-label="Playback speed, now {{pl.speedLabel}}" style="height: 36px; min-width: 64px; padding: 0 12px; border-radius: 999px; border: 1px solid {{pl.speedBd}}; background: var(--card); color: var(--ink); font-size: 13px; font-family: 'IBM Plex Mono', monospace">{{pl.speedLabel}} ▾</button>
<sc-if value="{{pl.speedOpen}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; right: 0; bottom: 44px; z-index: 30; min-width: 96px; padding: 6px; border-radius: 12px; border: 1px solid var(--rule); background: var(--card); box-shadow: 0 12px 28px -8px {{t.sh}}; display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{pl.speeds}}" as="sp" hint-placeholder-count="7"><button onClick="{{sp.pick}}" style="height: 30px; padding: 0 12px; border: none; border-radius: 8px; text-align: left; background: {{sp.bg}}; color: {{sp.fg}}; font-weight: {{sp.fw}}; font-size: 13px; font-family: 'IBM Plex Mono', monospace">{{sp.l}}</button></sc-for>
</div>
</sc-if>
</div>
</div>
</div>
</div>
</template>
<script>
/* paper-film standalone runtime (MIT).
 * Renders the film template without any host runtime:
 *   {{path}} holes in text and attributes, <sc-for list as>, <sc-if value>, onClick="{{fn}}".
 * Re-renders patch the existing DOM in place, so CSS transitions play between beats.
 */
(function () {
  var SVG = 'http://www.w3.org/2000/svg';
  var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  var ONLY = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/;

  function lookup(scope, path) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return +path;
    var parts = path.split('.'), v = scope[parts[0]];
    for (var i = 1; i < parts.length && v != null; i++) v = v[parts[i]];
    return v;
  }
  function interp(str, scope) {
    return str.replace(HOLE, function (_, p) { var v = lookup(scope, p); return v == null ? '' : String(v); });
  }

  // template node -> array of vnodes
  function build(node, scope, inSvg) {
    if (node.nodeType === 3) {
      var t = node.nodeValue;
      if (t.indexOf('{{') < 0) return /\S/.test(t) || t === ' ' ? [{ text: t }] : (t.length ? [{ text: t }] : []);
      return [{ text: interp(t, scope) }];
    }
    if (node.nodeType !== 1) return [];
    var tag = node.localName;
    if (tag === 'sc-for') {
      var m = ONLY.exec(node.getAttribute('list') || ''), list = m ? lookup(scope, m[1]) : null, as = node.getAttribute('as') || 'item';
      var out = [];
      (list || []).forEach(function (item, idx) {
        var s = Object.create(scope); s[as] = item; s.$index = idx;
        kidsOf(node).forEach(function (c) { out.push.apply(out, build(c, s, inSvg)); });
      });
      return out;
    }
    if (tag === 'sc-if') {
      var mv = ONLY.exec(node.getAttribute('value') || ''), ok = mv ? lookup(scope, mv[1]) : false;
      if (!ok) return [];
      var res = [];
      kidsOf(node).forEach(function (c) { res.push.apply(res, build(c, scope, inSvg)); });
      return res;
    }
    var svg = inSvg || tag === 'svg', v = { tag: tag, svg: svg, attrs: {}, on: {}, kids: [] };
    for (var i = 0; i < node.attributes.length; i++) {
      var a = node.attributes[i], name = a.name, val = a.value;
      if (name.indexOf('hint-') === 0) continue;
      if (/^on[A-Z]/.test(name) || /^on[a-z]+$/.test(name)) {
        var mm = ONLY.exec(val); if (mm) v.on[name.slice(2).toLowerCase()] = lookup(scope, mm[1]);
        continue;
      }
      var only = ONLY.exec(val);
      v.attrs[name] = only ? lookup(scope, only[1]) : (val.indexOf('{{') >= 0 ? interp(val, scope) : val);
    }
    kidsOf(node).forEach(function (c) { v.kids.push.apply(v.kids, build(c, scope, svg)); });
    return [v];
  }
  function kidsOf(node) { return Array.prototype.slice.call((node.content || node).childNodes); }

  function create(v) {
    if (v.text != null) { var tn = document.createTextNode(v.text); tn.__v = v; return tn; }
    var el = v.svg ? document.createElementNS(SVG, v.tag) : document.createElement(v.tag);
    el.__v = { tag: v.tag, attrs: {}, on: {}, kids: [] };
    update(el, v);
    return el;
  }
  function setAttr(el, k, val) {
    if (val == null || val === false) { el.removeAttribute(k); return; }
    if (k === 'class') k = 'class';
    el.setAttribute(k, val === true ? '' : String(val));
  }
  function update(el, v) {
    var old = el.__v || { attrs: {}, on: {}, kids: [] };
    for (var k in v.attrs) if (old.attrs[k] !== v.attrs[k]) setAttr(el, k, v.attrs[k]);
    for (var k2 in old.attrs) if (!(k2 in v.attrs)) el.removeAttribute(k2);
    for (var e in v.on) el['on' + e] = typeof v.on[e] === 'function' ? v.on[e] : null;
    for (var e2 in old.on) if (!(e2 in v.on)) el['on' + e2] = null;
    patchKids(el, v.kids);
    el.__v = { tag: v.tag, attrs: v.attrs, on: v.on, kids: v.kids };
  }
  function patchKids(el, kids) {
    var cur = el.childNodes;
    for (var i = 0; i < kids.length; i++) {
      var nv = kids[i], ex = cur[i];
      if (!ex) { el.appendChild(create(nv)); continue; }
      var ov = ex.__v;
      if (nv.text != null) {
        if (ex.nodeType === 3) { if (ex.nodeValue !== nv.text) ex.nodeValue = nv.text; ex.__v = nv; }
        else el.replaceChild(create(nv), ex);
      } else if (ex.nodeType === 1 && ov && ov.tag === nv.tag) update(ex, nv);
      else el.replaceChild(create(nv), ex);
    }
    while (el.childNodes.length > kids.length) el.removeChild(el.lastChild);
  }

  window.DCLogic = function DCLogic(props) { this.props = props || {}; this.state = {}; };
  window.DCLogic.prototype.setState = function (o) {
    Object.assign(this.state, typeof o === 'function' ? o(this.state) : o);
    if (this.__schedule) this.__schedule();
  };
  window.DCLogic.prototype.forceUpdate = function () { if (this.__schedule) this.__schedule(); };

  window.mountFilm = function (Component, tplId, mountId, props) {
    var tpl = document.getElementById(tplId), root = document.getElementById(mountId);
    var comp = new Component(props || {}), queued = false;
    var render = function () {
      queued = false;
      var vals = comp.renderVals(), vnodes = [];
      kidsOf(tpl).forEach(function (n) { vnodes.push.apply(vnodes, build(n, vals, false)); });
      patchKids(root, vnodes.filter(function (v) { return v.text == null || /\S/.test(v.text); }));
    };
    comp.__schedule = function () { if (!queued) { queued = true; requestAnimationFrame(render); } };
    render();
    if (comp.componentDidMount) comp.componentDidMount();
    return comp;
  };
})();

class Component extends DCLogic {
  constructor(props) {
    super(props);

", "op": 0}, {"id": "bE", "type": "beam", "x": 0, "y": 0, "pts": "326,228 466,228", "op": 0}, {"id": "bD", "type": "beam", "x": 0, "y": 0, "pts": "699,228 866,228", "op": 0}, {"id": "bR", "type": "beam", "x": 0, "y": 0, "pts": "990,312 850,462", "label": "frame", "lx": 930, "ly": 384, "lfs": 14, "op": 0}, {"id": "bA", "type": "beam", "x": 0, "y": 0, "pts": "1166,386 1166,350 190,350 190,312", "label": "push(crate, +1.0)", "lx": 600, "ly": 350, "lfs": 15, "op": 0}, {"id": "bX", "type": "beam", "x": 0, "y": 0, "pts": "652,520 450,520", "tone": "bad", "op": 0}, {"id": "xb", "type": "badge", "x": 470, "y": 404, "text": "frames never write the state", "tone": "bad", "s": 1.2, "op": 0}], "beats": [{"cap": "The world is a program. The engine stores every object as a variable.", "src": "§2.1"}, {"cap": "Each step, the engine draws only shapes from the camera: a depth map. No textures and no 3D art.", "src": "§2.2", "set": {"eng": {"on": false}, "dep": {"op": 1, "on": true}, "bE": {"op": 1}}}, {"cap": "The video model paints the frame from these shapes, its recent frames and the reference photo.", "src": "§2.2, §3", "set": {"dep": {"on": false}, "ren": {"op": 1, "on": true}, "bD": {"op": 1}, "bR": {"op": 1}, "gp": {"op": 1}, "cp": {"op": 1}, "wp": {"op": 1}, "lp": {"op": 1}}}, {"cap": "The agent sees only the painted frame. It acts by sending a short Python program to the engine.", "src": "§5.3", "set": {"ren": {"on": false}, "rob": {"op": 1, "think": true}, "bA": {"op": 1}}}, {"cap": "The engine moves the crate in the state. The next depth map shows it. The painter draws it in its new place.", "src": "§2.1", "set": {"rob": {"think": false}, "eng": {"on": true, "lines": ["crate.x = 2.0", "robot.x = 0.2", "wall.x  = 3.0"], "hl": 0}, "cw": {"x": 260}, "cp": {"x": 880}, "bR": {"pts": "990,312 925,462", "lx": 966, "ly": 384}}}, {"cap": "Nothing goes back. Frames never change the state, so the rules stay exact even if the video drifts.", "src": "§2.1", "set": {"eng": {"on": false}, "bX": {"op": 1}, "xb": {"op": 1}}}]}, {"k": "scene", "title": "Building a world from one photo", "h": 400, "actors": [{"id": "ph", "type": "card", "x": 24, "y": 24, "w": 180, "h": 130, "icon": "photo", "label": "One photo", "sub": "look + layout", "fill": "paint"}, {"id": "t1", "type": "card", "x": 226, "y": 24, "w": 190, "h": 56, "icon": "mask", "label": "SAM 3", "sub": "object masks", "op": 0}, {"id": "t2", "type": "card", "x": 226, "y": 90, "w": 190, "h": 56, "icon": "depth", "label": "Depth Anything 3", "sub": "depth, camera", "op": 0, "dl": 0.15}, {"id": "t3", "type": "card", "x": 430, "y": 24, "w": 190, "h": 56, "icon": "box3d", "label": "WildDet3D", "sub": "3D boxes", "op": 0, "dl": 0.3}, {"id": "t4", "type": "card", "x": 430, "y": 90, "w": 190, "h": 56, "icon": "mesh", "label": "SAM 3D", "sub": "object meshes", "op": 0, "dl": 0.45}, {"id": "code", "type": "card", "x": 636, "y": 24, "w": 180, "h": 170, "icon": "code", "label": "Scene program", "sub": "written by the agent", "fill": "code", "lines": ["table = box(1.2, 0.8)", "chair = mesh(\"chair\")", "chair.y = 0.45", "check_contact()"], "op": 0}, {"id": "rob", "type": "robot", "x": 60, "y": 268, "label": "coding agent"}, {"id": "g", "type": "ground", "x": 300, "y": 360, "w": 516, "look": "wire", "op": 0}, {"id": "tab", "type": "block", "x": 400, "y": 300, "w": 160, "h": 60, "label": "table", "look": "wire", "op": 0}, {"id": "ch", "type": "block", "x": 610, "y": 236, "w": 60, "h": 60, "label": "chair", "look": "wire", "op": 0}, {"id": "cam1", "type": "icon", "x": 310, "y": 206, "icon": "camera", "label": "probe", "op": 0}, {"id": "cam2", "type": "icon", "x": 748, "y": 236, "icon": "camera", "label": "probe", "op": 0, "dl": 0.2}, {"id": "bC", "type": "beam", "x": 0, "y": 0, "pts": "700,196 650,232", "op": 0}, {"id": "fb", "type": "badge", "x": 470, "y": 200, "text": "chair floats ✕", "tone": "bad", "op": 0}, {"id": "okb", "type": "badge", "x": 480, "y": 200, "text": "contact ✓", "tone": "ok", "op": 0}], "beats": [{"cap": "To build a world, start from one photo. The photo gives the look and a rough layout.", "src": "§2.3", "set": {"ph": {"on": true}}}, {"cap": "A coding agent runs vision tools on the photo: object masks, depth and camera, 3D boxes and object shapes.", "src": "§2.3", "set": {"ph": {"on": false}, "rob": {"think": true}, "t1": {"op": 1}, "t2": {"op": 1}, "t3": {"op": 1}, "t4": {"op": 1}}}, {"cap": "From these results, it writes the scene program. Rough shapes are enough.", "src": "§2.3", "set": {"code": {"op": 1, "on": true}, "g": {"op": 1}, "tab": {"op": 1}, "ch": {"op": 1}, "bC": {"op": 1}}}, {"cap": "It renders test views and asks the engine: do objects touch? Do they collide? Here, the chair floats.", "src": "§2.3", "set": {"code": {"on": false, "hl": 3}, "cam1": {"op": 1}, "cam2": {"op": 1}, "fb": {"op": 1}, "rob": {"think": false}, "bC": {"op": 0}}}, {"cap": "It fixes the code and runs the checks again. The checks read the state, not the pixels.", "src": "§2.3", "set": {"code": {"lines": ["table = box(1.2, 0.8)", "chair = mesh(\"chair\")", "chair.y = 0.0", "check_contact()"], "hl": 2, "on": true}, "ch": {"y": 300}, "fb": {"op": 0}, "okb": {"op": 1}}}, {"cap": "You can also start from text. Then an image editor makes the reference photo. In the paper, each world was still built one at a time.", "src": "§2.3, §7", "set": {"code": {"on": false}}}], "zoom": 1.18, "ox": 144, "oy": 140}, {"k": "scene", "title": "The painter: 16 frames at a time", "h": 390, "actors": [{"id": "l1", "type": "label", "x": 24, "y": 46, "text": "geometry in · depth from the engine", "fs": 12}, {"id": "dep", "type": "strip", "x": 584, "y": 40, "pat": "dddd", "fw": 36, "fh": 30, "gap": 4}, {"id": "l2", "type": "label", "x": 24, "y": 126, "text": "memory · 5 pinned + 44 recent frames (fewer drawn)", "fs": 12, "op": 0}, {"id": "mem", "type": "strip", "x": 24, "y": 150, "pat": "PPPPPpppppppp.", "fw": 36, "fh": 30, "gap": 4, "texts": ["ref"], "op": 0}, {"id": "new", "type": "strip", type": "block", "x": 790, "y": 280, "w": 320, "h": 240, "color": "#E6EEFB", "op": 0.35}, {"id": "t1", "type": "text", "x": 126, "y": 452, "w": 290, "text": "*1 · Follow the shapes*", "fs": 19}, {"id": "d1", "type": "text", "x": 126, "y": 482, "w": 290, "text": "paints frames that match a depth map", "fs": 15, "tone": "muted"}, {"id": "t2", "type": "text", "x": 466, "y": 372, "w": 290, "text": "*2 · Use only the past*", "fs": 19, "op": 0.35}, {"id": "d2", "type": "text", "x": 466, "y": 402, "w": 290, "text": "paints block by block, so actions can arrive at any time", "fs": 15, "tone": "muted", "op": 0.35}, {"id": "t3", "type": "text", "x": 806, "y": 292, "w": 290, "text": "*3 · Fast and sharp*", "fs": 19, "op": 0.35}, {"id": "d3", "type": "text", "x": 806, "y": 322, "w": 290, "text": "4 steps per block; a teacher and a realism critic", "fs": 15, "tone": "muted", "op": 0.35}, {"id": "rob", "type": "robot", "x": 230, "y": 330, "s": 1.2}, {"id": "vid", "type": "icon", "x": 140, "y": 210, "icon": "film", "label": "real videos", "s": 1.2}, {"id": "dt", "type": "icon", "x": 300, "y": 210, "icon": "depth", "label": "depth tool", "s": 1.2, "op": 0}, {"id": "bb", "type": "beam", "x": 0, "y": 0, "pts": "204,240 294,240", "op": 0}, {"id": "gpu", "type": "icon", "x": 1110, "y": 160, "icon": "gpu", "label": "32 × H100", "s": 1.2, "op": 0}], "beats": [{"cap": "Stage 1 starts from a pretrained video model (Cosmos 3-Nano). It learns to paint frames that follow a depth or normal map.", "src": "§3.2"}, {"cap": "The training data is real video. A depth tool extracts the shapes, so no hand labels are needed. Blur and noise make engine shapes and real shapes look alike.", "src": "§2.2, §3.2", "set": {"dt": {"op": 1}, "bb": {"op": 1}}}, {"cap": "Stage 2 makes it causal. Each block of frames uses only the past, so new actions can enter at any block.", "src": "§3.3", "set": {"rob": {"x": 570, "y": 250}, "st2": {"op": 1}, "t2": {"op": 1}, "d2": {"op": 1}}}, {"cap": "Stage 3 makes it fast: 4 steps per block. A teacher model and a realism critic, trained on real video, keep frames sharp.", "src": "§3.4", "set": {"rob": {"x": 910, "y": 170}, "st3": {"op": 1}, "t3": {"op": 1}, "d3": {"op": 1}}}, {"cap": "All three stages train on 32 H100 GPUs.", "src": "App. A, Table 5", "set": {"gpu": {"op": 1}}}]}, {"title": "Exact replay · why the history must be trained", "actors": [{"id": "ml", "type": "text", "x": 150, "y": 156, "w": 900, "text": "memory (KV cache): the keys and values each finished block leaves for later blocks", "fs": 14, "tone": "muted", "font": "mono", "op": 0}, {"id": "kv", "type": "tokens", "x": 150, "y": 190, "words": ["KV 1", "KV 2", "KV 3", "KV 4"], "tw": 150, "th": 44, "gap": 40, "fs": 16, "upto": 0}, {"id": "w0", "type": "beam", "x": 0, "y": 0, "pts": "225,366 225,238", "tone": "muted", "op": 0}, {"id": "w1", "type": "beam", "x": 0, "y": 0, "pts": "415,366 415,238", "tone": "muted", "op": 0}, {"id": "w2", "type": "beam", "x": 0, "y": 0, "pts": "605,366 605,238", "tone": "muted", "op": 0}, {"id": "w3", "type": "beam", "x": 0, "y": 0, "pts": "795,366 795,238", "tone": "muted", "op": 0}, {"id": "r0", "type": "beam", "x": 0, "y": 0, "pts": "265,238 375,366", "tone": "muted", "op": 0}, {"id": "r1", "type": "beam", "x": 0, "y": 0, "pts": "455,238 565,366", "tone": "muted", "op": 0}, {"id": "r2", "type": "beam", "x": 0, "y": 0, "pts": "645,238 755,366", "tone": "muted", "op": 0}, {"id": "bl", "type": "tokens", "x": 150, "y": 370, "words": ["block 1", "block 2", "block 3", "block 4"], "tw": 150, "th": 50, "gap": 40, "fs": 17, "upto": 1}, {"id": "loss", "type": "badge", "x": 722, "y": 470, "text": "loss on block 4", "tone": "bad", "s": 1.15, "op": 0}, {"id": "g", "type": "beam", "x": 0, "y": 0, "pts": "795,466 795,424", "op": 0}, {"id": "cut", "type": "beam", "x": 0, "y": 0, "pts": "765,366 625,240", "tone": "bad", "label": "gradient stops ✕", "lfs": 13, "lx": 700, "ly": 300, "op": 0}, {"id": "cost", "type": "text", "x": 150, "y": 530, "w": 900, "text": "One long differentiable pass would keep every block’s cache-writing graph in memory.", "fs": 18, "box": "plain", "op": 0}], "beats": [{"cap": "Stage 3 trains the painter on its own long runs. It writes the video block by block.", "src": "§3.4", "set": {"kv": {"upto": 1}, "w0": {"op": 1}}}, {"cap": "Each finished block leaves keys and values in a memory, the KV cache. Every later block reads from it.", "src": "§3.4.2", "set": {"kv": {"upto": 4}, "bl": {"upto": 4}, "ml": {"op": 1}, "w0": {"op": 1}, "w1": {"op": 1}, "w2": {"op": 1}, "w3": {"op": 1}, "r0": {"op": 1}, "r1": {"op": 1}, "r2": {"op": 1}}}, {"cap": "Say block 4 comes out wrong. Its loss trains how block 4 is predicted from the cache.", "src": "§3.4.2", "set": {"bl": {"on": [3]}, "loss": {"op": 1}, "g": {"op": 1}}}, {"cap": "But in standard Self Forcing the cache is detached. The loss never reaches the step that wrote the keys and values, so the model never learns to write better history.", "src": "§3.4.2", "set": {"cut": {"op": 1}}}, {"cap": "Keeping that step differentiable in one long serial pass would carry a large memory cost.", "src": "§3.4.2", "set": {"cost": {"op": 1}}}]}, {"title": "Exact replay · record, then replay", "actors": [{"id": "la", "type": "text", "x": 48, "y": 172, "w": 240, "text": "pass 1 · no gradients", "fs": 16, "fw": 600}, {"id": "ra", "type": "cells", "x": 300, "y": 160, "pat": "bbbb", "cw": 150, "ch": 44, "gap": 30, "texts": ["block 1", "block 2", "block 3", "block 4"]}, {"id": "rec", "type": "text", "x": 300, "y": 214, "w": 690, "text": "records per block: its input at the last denoising step, and its clean output", "fs": 14, "tone": "muted", "font": "mono", "op": 0}, {"id": "lb", "type": "text", "x": 48, "y": 302, "w": 240, "text": "pass 2 · replay with gradients", "fs": 16, "fw": 600, "op": 0}, {"id": "rb", "type": "cells", "x": 300, "y": 290, "pat": "gggg", "cw": 150, "ch": 44, "gap": 30, "texts": ["block 1", "block 2", "block 3", "block 4"], "op": 0}, {"id": "hist", "type": "text", "x": 300, "y": 410, "w": 690, "text": "recomputes each block’s history keys and values, inside the graph", "fs": 14, "tone": "muted", "font": "mono", "op": 0}, {"id": "g", "type": "beam", "x": 0, "y": 0, "pts": "915,336 915,392 375,392 375,336", "label": "gradient reaches the cache", "lfs": 13, "lx": 645, "ly": 392, "op": 0}, {"id": "ls", "type": "text", "x": 300, "y": 452, "w": 690, "text": "Losses on the replayed output: *DMD* (frozen stage-1 teacher vs a fake-score model) and *adversarial* (a discriminator on real vs generated clips)", "fs": 17, "box": "acc", "op": 0}], "beats": [{"cap": "The fix splits the work in two. Pass 1 plays the run without gradients and records, per block, its input at the last denoising step and its clean output.", "src": "§3.4.2", "set": {"rec": {"op": 1}}}, {"cap": "Pass 2 replays the run with gradients. It recomputes each block’s history keys and values, with the same visibility pattern as stage 2 training.", "src": "§3.4.2, §3.3", "set": {"lb": {"op": 1}, "rb": {"op": 1}, "hist": {"op": 1}}}, {"cap": "Now the loss on block 4 flows back into how blocks 1 to 3 wrote their keys and values.", "src": "§3.4.2", "set": {"g": {"op": 1}}}, {"cap": "Two losses use the replayed output: DMD pulls it toward the frozen stage-1 teacher, and a discriminator, trained on real and generated clips, pushes it toward real video.", "src": "§3.4.1, §3.4.3", "set": {"ls": {"op": 1}}}]}, {"title": "Exact replay · why the replay must match exactly", "actors": [{"id": "f1", "type": "text", "x": 48, "y": 160, "w": 540, "text": "(0.1 + 0.2) + 0.3 = 0.6000000000000001", "fs": 20, "font": "mono", "box": "plain"}, {"id": "f2", "type": "text", "x": 48, "y": 222, "w": 540, "text": "0.1 + (0.2 + 0.3) = 0.6", "fs": 20, "font": "mono", "box": "plain"}, {"id": "f3", "type": "text", "x": 48, "y": 284, "w": 540, "text": "Same numbers, different order: different last digits (64-bit floats).", "fs": 16, "tone": "muted"}, {"id": "l1", "type": "text", "x": 660, "y": 160, "w": 560, "text": "earlier replay · Self Gradient Forcing", "fs": 15, "fw": 600, "op": 0}, {"id": "c1", "type": "cells", "x": 660, "y": 188, "pat": "w", "cw": 398, "ch": 44, "texts": ["one full-sequence attention call"], "op": 0}, {"id": "d1", "type": "text", "x": 1080, "y": 200, "w": 150, "text": "drifts", "fs": 17, "tone": "bad", "fw": 600, "op": 0}, {"id": "l2", "type": "text", "x": 660, "y": 262, "w": 560, "text": "exact replay · block by block, like pass 1", "fs": 15, "fw": 600, "op": 0}, {"id": "c2", "type": "cells", "x": 660, "y": 290, "pat": "gggg", "cw": 92, "ch": 44, "gap": 10, "texts": ["block 1", "block 2", "block 3", "block 4"], "op": 0}, {"id": "d2", "type": "text", "x": 1080, "y": 302, "w": 150, "text": "bit for bit", "fs": 17, "tone": "ok", "fw": 600, "op": 0}], "beats": [{"cap": "Why “exact” matters: on a computer, the order of additions changes the last digits of a result.", "kind": "ours"}, {"cap": "The earlier method, Self Gradient Forcing, replays everything in one full-sequence attention call. Kernel, shapes and summation order differ from pass 1, so its numbers drift.", "src": "§3.4.2", "set": {"l1": {"op": 1}, "c1": {"op": 1}, "d1": {"op": 1}}}, {"cap": "Exact replay runs block by block, with the same attention kernel, key–value order and call shapes as pass 1. Its numbers match pass 1 bit for bit.", "src": "§3.4.2", "set": {"l2": {"op": 1}, "c2": {"op": 1}, "d2": {"op": 1}}}]}, {"k": "scene", "title": "Rounds of practice", "h": 380, "actors": [{"id": "task", "type": "card", "x": 24, "y": 24, "w": 180, "h": 116, "icon": "task", "label": "Task file", "sub": "no solution", "fill": "list", "lines": ["goal", "actions", "limits"]}, {"id": "scr", "type": "card", "x": 240, "y": 24, "w": 200, "h": 130, "icon": "film", "label": "Frames only", "sub": "no map, no score", "fill": "paint", "op": 0}, {"id": "ra", "type": "robot", "x": 300, "y": 236, "label": "agent · round r", "op": 0}, {"id": "bub", "type": "bubble", "x": 214, "y": 186, "text": "move(+0.5); look()", "op": 0}, {"id": "clk", "type": "icon", "x": 470, "y": 226, "icon": "clock", "tone": "acc", "label": "world paused", "op": 0}, {"id": "pb", "type": "card", "x": 600, "y": 24, "w": 216, "h": 150, "icon": "book", "label": "Playbook", "sub": "one lesson per file", "fill": "list", "lines": [], "op": 0.3}, {"id": "pg0", "type": "icon", "x": 330, "y": 250, "icon": "page", "op": 0, "dl": 0.0}, {"id": "pg1", "type": "icon", "x": 330, "y": 250, "icon": "page", "op": 0, "dl": 0.25}, {"id": "pg2", "type": "icon", "x": 330, "y": 250, "icon": "page", "op": 0, "dl": 0.5}, {"id": "bP", "type": "beam", "x": 0, "y": 0, "pts": "708,178 708,226", "op": 0}, {"id": "rb", "type": "robot", "x": 673, "y": 236, "label": "fresh agent · round r+1", "op": 0}, {"id": "stamp", "type": "badge", "x": 430, "y": 300, "text": "claims, not truth", "tone": "acc", "op": 0}], "beats": [{"cap": "Each round starts with a task file: the goal, the allowed actions and the limits. It gives no solution.", "src": "§5.3", "set": {"task": {"on": true}}}, {"cap": "The agent sees only frames: no map, no coordinates, no score until the end. It acts with short Python programs. The world waits while it thinks.", "src": "§5.3, App. D", "set": {"task": {"on": false}, "scr": {"op": 1}, "ra": {"op": 1, "think": true}, "bub": {"op": 1}, "clk": {"op": 1}}}, {"cap": "After the game, each agent writes lessons: what it tried, saw and doubts, and what to test next. One lesson per file.", "src": "§5.2–5.3", "set": {"ra": {"think": false}, "bub": {"op": 0}, "pb": {"op": 1, "on": true, "lines": ["tried: …", "saw: …", "doubts: …", "test next: …"]}, "pg0": {"op": 1, "x": 762, "y": 36, "s": 0.8}, "pg1": {"op": 1, "x": 762, "y": 78, "s": 0.8}, "pg2": {"op": 1, "x": 762, "y": 120, "s": 0.8}}}, {"cap": "Next round, fresh agents start with the task file and all earlier lessons. They have no other memory.", "src": "§5.3", "set": {"pb": {"on": false}, "ra": {"op": 0.25}, "scr": {"op": 0.4}, "clk": {"op": 0}, "bP": {"op": 1}, "rb": {"op": 1}, "pg0": {"op": 0}, "pg1": {"op": 0}, "pg2": {"op": 0}}}, {"cap": "Lessons are claims, not facts. The task file tells agents to test a lesson before they trust it.", "src": "App. D", "set": {"stamp": {"op": 1}, "rb": {"think": true}}}], "zoom": 1.25, "ox": 115, "oy": 140}]}, {"n": "04", "name": "Evidence", "short": "Evidence", "lede": "Four tests. Each one checks one claim.", "scenes": [{"title": "How they tested it", "actors": [{"id": "tb", "type": "table", "x": 48, "y": 160, "w": 1184, "fs": 18, "hfs": 15, "rpad": 13, "upto": 0, "ghost": true, "cols": "1fr 1.5fr 1.9fr 1.3fr", "head": ["Test", "Question", "How they measured", "Result"], "rows": [{"c": ["Exact replay", "Does the training replay match the original run?", "Difference from the original run, on one H100", "0 drift (old: 3.99%)"], "tones": [null, null, null, "acc"], "bold": [3]}, {"c": ["Speed", "Is the painter fast enough for live play?", "Milliseconds per 16-frame block, on one H100", "36.5 fps"], "tones": [null, null, null, "acc"], "bold": [3]}, {"c": ["Hide-and-seek", "Can agents that see only painted frames learn tool use?", "Rerun of OpenAI 2019; the round when each skill appears", "shelters by round 4, ramps by round 10"], "tones": [null, null, null, "acc"], "bold": [3]}, {"c": ["Four new worlds", "Do written lessons help over rounds?", "Each world’s own score; one game per round; 4 rounds", "round 4 beats round 1 in all four"], "tones": [null, null, null, "acc"], "bold": [3]}]}], "beats": [{"cap": "The paper runs four tests. Each test checks one claim. First, the training trick.", "src": "§4.2", "set": {"tb": {"upto": 1}}, "read": 3}, {"cap": "Second, the speed of the painter.", "src": "§4.3", "set": {"tb": {"upto": 2}}, "read": 3}, {"cap": "Third, a famous experiment: hide-and-seek.", "src": "§5.2", "set": {"tb": {"upto": 3}}, "read": 3}, {"cap": "Fourth, four new worlds that test the written lessons.", "src": "§5.4", "set": {"tb": {"upto": 4}}, "read": 3}]}, {"title": "Exact replay: zero drift, same cost", "actors": [{"id": "a", "type": "stat", "x": 48, "y": 170, "w": 300, "v": "3.99%", "l": "drift with Self Gradient Forcing replay", "tone": "bad"}, {"id": "b", "type": "stat", "x": 48, "y": 330, "w": 300, "v": "0", "l": "drift with exact replay (bit for bit)", "tone": "ok", "on": true, "op": 0}, {"id": "tb", "type": "table", "x": 420, "y": 180, "w": 810, "fs": 20, "hfs": 15, "rpad": 15, "upto": 0, "ghost": true, "cols": "1.3fr 1fr 1fr", "align": ["left", "right", "right"], "mono": [1, 2], "head": ["Measure", "Self Gradient Forcing replay", "Exact replay"], "rows": [{"c": ["Drift from the original run", "3.99%", "0"], "tones": [null, "bad", "ok"], "hl": true}, {"c": ["Forward time", "2.95 s", "2.79 s"]}, {"c": ["Peak memory", "50.83 GiB", "50.92 GiB"]}]}, {"id": "su", "type": "text", "x": 420, "y": 420, "w": 810, "text": "Setup: one H100 · 36 layers · 61 latent frames · median of 3 warm runs", "fs": 16, "tone": "muted", "font": "mono"}], "beats": [{"cap": "They replay the same run two ways and compare each with the original run.", "src": "Table 1, §4.2"}, {"cap": "Exact replay removes the drift completely.", "src": "Table 1", "set": {"b": {"op": 1}, "tb": {"upto": 1}}}, {"cap": "It is also slightly faster and uses almost the same memory. The fix is free.", "src": "Table 1", "set": {"tb": {"upto": 3}}, "read": 2}]}, {"title": "Speed: faster than real time on one GPU", "actors": [{"id": "b1", "type": "bars", "x": 48, "y": 165, "w": 580, "title": "Time to paint one block of 16 frames", "sub": "milliseconds, one H100", "lw": 200, "vw": 96, "fs": 17, "bh": 24, "gap": 12, "max": 440, "upto": 0, "rows": [{"n": "Transformer, 4 steps", "v": 414.4, "l": "414.4"}, {"n": "Shape encoding", "v": 10.6, "l": "10.6"}, {"n": "Decoder + transfer", "v": 8.8, "l": "8.8"}, {"n": "Total", "v": 438.8, "l": "438.8", "hl": true}]}, {"id": "b2", "type": "bars", "x": 690, "y": 165, "w": 540, "title": "Paint 16 frames vs play them", "sub": "seconds (playback at 16 fps; our arithmetic)", "lw": 150, "vw": 70, "fs": 17, "bh": 34, "gap": 16, "max": 1.0, "upto": 0, "rows": [{"n": "Paint", "v": 0.44, "l": "0.44 s", "hl": true}, {"n": "Play", "v": 1.0, "l": "1.00 s"}]}, {"id": "s", "type": "stat", "x": 690, "y": 380, "w": 300, "v": "36.5 fps", "l": "painted, at 480 × 832", "on": true, "op": 0}], "beats": [{"cap": "They time each part of one block on one H100, with full memory, over two long runs.", "src": "Table 2, §4.3", "set": {"b1": {"upto": 4}}, "read": 2}, {"cap": "Painting 16 frames takes 0.44 s. Playing them takes 1 s. So the painter runs faster than real time: 36.5 frames per second.", "src": "§4.3", "set": {"b2": {"upto": 2}, "s": {"op": 1}}}]}, {"title": "Hide-and-seek: agents learn to use tools", "actors": [{"id": "g", "type": "ground", "x": 40, "y": 540, "w": 640, "look": "paint"}, {"id": "hid", "type": "robot", "x": 300, "y": 411, "s": 1.4, "body": "#DDF0E4", "label": "hider"}, {"id": "w1", "type": "wall", "x": 90, "y": 372, "s": 1.4, "op": 0.6}, {"id": "w2", "type": "wall", "x": 600, "y": 372, "s": 1.4, "op": 0.6}, {"id": "sk", "type": "robot", "x": 560, "y": 411, "s": 1.4, "body": "#F8DEDE", "lookdir": "l", "label": "seeker"}, {"id": "rp", "type": "ramp", "x": 600, "y": 456, "w": 120, "h": 84, "flip": true, "op": 0.6}, {"id": "tb", "type": "table", "x": 720, "y": 175, "w": 510, "fs": 19, "hfs": 15, "rpad": 14, "upto": 0, "ghost": true, "cols": "1.4fr 1fr 0.9fr", "head": ["Skill", "OpenAI 2019", "This paper"], "rows": [{"c": ["Hiders build shelters", "≈ 25M episodes", "round 4"], "tones": [null, null, "acc"], "bold": [2]}, {"c": ["Seekers use ramps", "≈ 100M episodes", "round 10"], "tones": [null, null, "acc"], "bold": [2]}]}, {"id": "warn", "type": "text", "x": 720, "y": 380, "w": 510, "text": "Different units. Do not divide one column by the other.", "fs": 19, "box": "bad", "op": 0}], "beats": [{"cap": "They rerun OpenAI’s 2019 hide-and-seek. One hider, one seeker, 5 games per round. The agents see only painted frames.", "src": "§5.2"}, {"cap": "By round 4, the hider moves panels to build a shelter.", "src": "§5.2, Table 3", "set": {"w1": {"x": 255, "op": 1}, "w2": {"x": 404, "op": 1}, "tb": {"upto": 1}}}, {"cap": "By round 10, the seeker carries a ramp to the wall to climb over it.", "src": "§5.2, Fig. 10", "set": {"rp": {"x": 436, "op": 1}, "sk": {"x": 450, "y": 327}, "tb": {"upto": 2}}}, {"cap": "The 2019 agents learned from scratch, with true positions. These agents are pretrained and keep written lessons. So this is not a speed-up claim.", "src": "§5.2", "set": {"warn": {"op": 1}}}]}, {"title": "Four new worlds: better by round 4", "actors": [{"id": "m1", "type": "bars", "x": 48, "y": 160, "w": 560, "title": "Companion dog", "sub": "engagement · higher is better", "lw": 80, "vw": 70, "fs": 15, "tfs": 17, "bh": 16, "gap": 5, "max": 20, "upto": 0, "rows": [{"n": "Round 1", "v": 13, "l": "13", "hl": false}, {"n": "Round 2", "v": 14, "l": "14", "hl": false}, {"n": "Round 3", "v": 19, "l": "19", "hl": false}, {"n": "Round 4", "v": 19, "l": "19", "hl": true}]}, {"id": "m2", "type": "bars", "x": 672, "y": 160, "w": 560, "title": "One-lane bridge", "sub": "seconds · lower is better", "lw": 80, "vw": 70, "fs": 15, "tfs": 17, "bh": 16, "gap": 5, "max": 75, "upto": 0, "rows": [{"n": "Round 1", "v": 71, "l": "71", "hl": false}, {"n": "Round 2", "v": 68, "l": "68", "hl": false}, {"n": "Round 3", "v": 45, "l": "45", "hl": false}, {"n": "Round 4", "v": 41, "l": "41", "hl": true}]}, {"id": "m3", "type": "bars", "x": 48, "y": 375, "w": 560, "title": "Herding", "sub": "score out of 100", "lw": 80, "vw": 70, "fs": 15, "tfs": 17, "bh": 16, "gap": 5, "max": 100, "upto": 0, "rows": [{"n": "Round 1", "v": 60, "l": "60", "hl": false}, {"n": "Round 2", "v": 90.1, "l": "90.1", "hl": false}, {"n": "Round 3", "v": 87.6, "l": "87.6", "hl": false}, {"n": "Round 4", "v": 88.3, "l": "88.3", "hl": true}]}, {"id": "m4", "type": "bars", "x": 672, "y": 375, "w": 560, "title": "Quarry loader", "sub": "score out of 100", "lw": 80, "vw": 70, "fs": 15, "tfs": 17, "bh": 16, "gap": 5, "max": 100, "upto": 0, "rows": [{"n": "Round 1", "v": 30, "l": "30", "hl": false}, {"n": "Round 2", "v": 0, "l": "0", "hl": false, "tone": "bad"}, {"n": "Round 3", "v": 30, "l": "30", "hl": false}, {"n": "Round 4", "v": 90.9, "l": "90.9", "hl": true}]}], "beats": [{"cap": "Four new worlds, each with its own goal and score. Agents play 4 rounds and pass lessons forward. One game per round.", "src": "§5.4"}, {"cap": "Round 4 beats round 1 in every world. The quarry loader finishes all 3 jobs in 329 of 360 seconds.", "src": "Table 4, §5.4", "set": {"m1": {"upto": 4}, "m2": {"upto": 4}, "m3": {"upto": 4}, "m4": {"upto": 4}}, "read": 3}, {"cap": "But the results are noisy: the quarry score falls to 0 in round 2. One game per round cannot show how reliable the gain is.", "kind": "ours"}]}]}, {"n": "05", "name": "Using it", "short": "Using it", "lede": "Is it for you? Three ways to use it, the settings, and what breaks.", "scenes": [{"title": "Is it for you?", "actors": [{"id": "use", "type": "list", "x": 48, "y": 165, "w": 560, "upto": 0, "stagger": true, "fs": 20, "gap": 20, "mark": "check", "mk": 30, "title": "Use it when", "ttone": "ok", "tfs": 18, "items": [{"t": "Your agents act from camera images and need many varied worlds."}, {"t": "You need rules you can inspect, reset and replay, but realistic views."}, {"t": "Your scenes can be written as code with rough shapes."}]}, {"id": "skip", "type": "list", "x": 672, "y": 165, "w": 560, "upto": 0, "stagger": true, "fs": 20, "gap": 20, "mark": "cross", "mk": 30, "title": "Skip it when", "ttone": "bad", "tfs": 18, "items": [{"t": "The task depends on color, material or identity. Shapes cannot carry these."}, {"t": "Success depends on fine contact or thin parts seen in frames."}, {"t": "You have no H100-class GPU. One live stream used one H100."}, {"t": "You need proven gains. The agent results are single runs."}]}], "beats": [{"cap": "Use it when your agents learn from camera images and need many testable worlds.", "src": "§1, §2", "set": {"use": {"upto": 3}}, "read": 3}, {"cap": "Skip it when the task needs color or fine detail, or when you have no H100-class GPU.", "src": "§7, §4.3", "set": {"skip": {"upto": 4}}, "read": 4}]}, {"title": "Three ways to use it", "actors": [{"id": "p1t", "type": "text", "x": 48, "y": 162, "w": 380, "text": "Test your agent", "fs": 22, "fw": 600, "op": 0.2}, {"id": "p1w", "type": "text", "x": 48, "y": 196, "w": 380, "text": "You build agents and want realistic, repeatable practice.", "fs": 16, "tone": "muted", "op": 0.2}, {"id": "p1", "type": "list", "x": 48, "y": 250, "w": 380, "upto": 0, "ghost": true, "stagger": true, "fs": 18, "gap": 16, "mk": 28, "mfs": 14, "items": [{"t": "Start from the released code and one of its worlds."}, {"t": "Connect your agent: frames in, short Python programs out."}, {"t": "Run rounds with lessons. Keep one run without lessons as a control."}]}, {"id": "p2t", "type": "text", "x": 450, "y": 162, "w": 380, "text": "Write a new world", "fs": 22, "fw": 600, "op": 0.2}, {"id": "p2w", "type": "text", "x": 450, "y": 196, "w": 380, "text": "You need a scene the library does not have.", "fs": 16, "tone": "muted", "op": 0.2}, {"id": "p2", "type": "list", "x": 450, "y": 250, "w": 380, "upto": 0, "ghost": true, "stagger": true, "fs": 18, "gap": 16, "mk": 28, "mfs": 14, "items": [{"t": "Write the scene as code with rough shapes. Add a reference photo and a caption."}, {"t": "Check contact, collisions and occlusion in the engine."}, {"t": "Write a task file: goal, actions, limits. No solution."}, {"t": "Accept the world only if it is solvable and a careless plan fails."}]}, {"id": "p3t", "type": "text", "x": 852, "y": 162, "w": 380, "text": "Borrow the idea", "fs": 22, "fw": 600, "op": 0.2}, {"id": "p3w", "type": "text", "x": 852, "y": 196, "w": 380, "text": "Your product puts a generative model in front of real data.", "fs": 16, "tone": "muted", "op": 0.2}, {"
