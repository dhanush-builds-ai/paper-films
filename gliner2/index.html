<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GLiNER2: Efficient Multi-Task Information Extraction · paper film</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&amp;family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
html,body{height:100%}
#film{height:100vh}
body{margin:0}
button{cursor:pointer;font-family:inherit}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes plpulse{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes plflow{to{stroke-dashoffset:-26}}
@keyframes plblink{0%,100%{opacity:.15}50%{opacity:1}}
.h{font-family:'Newsreader',serif}
.mono{font-family:'IBM Plex Mono',monospace}
.btn{height:34px;padding:0 13px;border-radius:8px;border:1px solid var(--rule);background:var(--card);font-size:13.5px;color:var(--ink)}
.seg{height:100%;border:none;padding:0;background:transparent;border-right:2px solid var(--card)}
.seg:hover{background:rgba(0,0,0,.08)}
.chap{height:32px;padding:0 12px;border-radius:999px;font-size:13px;white-space:nowrap}
</style>
</head>
<body>
<div id="film"></div>
<template id="film-tpl">
<div style="--bg: {{t.bg}}; --card: {{t.card}}; --ink: {{t.ink}}; --muted: {{t.muted}}; --label: {{t.label}}; --rule: {{t.rule}}; --acc: {{accent}}; --accsoft: {{accSoft}}; width: 100%; height: 100%; min-height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font-family: 'IBM Plex Sans', sans-serif; padding: 14px 24px 16px; overflow: hidden">

<div data-topbar="1" style="flex-shrink: 0; display: flex; align-items: center; gap: 16px; height: 42px; min-width: 0">
<div data-papertitle="1" style="min-width: 0; flex: 1 1 auto">
<div class="mono" style="font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{meta.line}}</div>
<div class="h" style="font-size: 19px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{meta.title}}</div>
</div>
<div style="display: flex; gap: 12px; flex-shrink: 0; font-size: 13px">
<sc-for list="{{meta.links}}" as="lk" hint-placeholder-count="2"><a href="{{lk.u}}" target="_blank" rel="noopener" style="color: var(--acc); text-decoration: none">{{lk.t}} ↗</a></sc-for>
</div>
</div>
<div data-chips="1" style="flex-shrink: 0; min-width: 0; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; margin: 6px 0 10px">
<div style="display: flex; gap: 6px; width: max-content">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="8"><button class="chap" onClick="{{c.pick}}" style="border: 1px solid {{c.bd}}; background: {{c.bg}}; color: {{c.fg}}; font-weight: {{c.fw}}"><span class="mono" style="font-size: 11px; opacity: .7; margin-right: 6px">{{c.n}}</span>{{c.name}}</button></sc-for>
</div>
</div>

<div id="{{pid}}-holder" style="flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center">
<div style="position: relative; width: {{stW}}px; height: {{stH}}px; flex-shrink: 0">
<div data-stage="1" style="position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform: scale({{scale}}); transform-origin: 0 0; background: var(--card); border-radius: 22px; box-shadow: 0 0 0 1px var(--rule), 0 2px 6px {{t.shSoft}}, 0 24px 60px -16px {{t.sh}}; overflow: hidden">

<sc-for list="{{scenes}}" as="sc" hint-placeholder-count="6">
<div data-scene="1" style="position: absolute; inset: 0; opacity: {{sc.op}}; transition: opacity .7s ease; pointer-events: {{sc.pe}}">

<div style="position: absolute; left: 0; right: 0; top: 0; height: 196px; background: var(--bg); opacity: {{sc.band}}"></div>
<div class="mono" style="position: absolute; left: 48px; top: 26px; font-size: 13px; letter-spacing: .08em; color: var(--acc); text-transform: uppercase">{{sc.tag}}</div>
<div data-headline="1" class="h" style="position: absolute; left: 48px; top: 46px; width: 1000px; font-size: 34px; line-height: 1.12; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{sc.title}}</div>
<div style="position: absolute; right: 48px; top: 32px; display: flex; gap: 6px; align-items: center">
<sc-for list="{{sc.dots}}" as="dt" hint-placeholder-count="6"><button onClick="{{dt.pick}}" aria-label="Beat {{dt.no}}" style="width: {{dt.w}}px; height: 8px; border-radius: 4px; border: none; padding: 0; background: {{dt.bg}}; transition: width .4s, background .4s"></button></sc-for>
</div>

<sc-for list="{{sc.actors}}" as="a" hint-placeholder-count="12">
<div data-actor="{{a.id}}" data-type="{{a.type}}" style="position: absolute; left: 0; top: 0; width: {{a.w}}px; transform: translate({{a.x}}px, {{a.y}}px) scale({{a.s}}); transform-origin: 0 0; opacity: {{a.op}}; transition: transform 1.2s cubic-bezier(.45,0,.2,1) {{a.dl}}s, opacity .8s ease {{a.dl}}s">
<sc-if value="{{a.isSvg}}" hint-placeholder-val="{{ false }}">
<div style="position: relative; width: {{a.w}}px; height: {{a.h}}px; animation: {{a.anim}}">
<svg width="{{a.w}}" height="{{a.h}}" viewBox="0 0 {{a.w}} {{a.h}}" style="overflow: visible; display: block">
<sc-for list="{{a.prims}}" as="q" hint-placeholder-count="8">
<sc-if value="{{q.isRect}}" hint-placeholder-val="{{ false }}"><rect x="{{q.x}}" y="{{q.y}}" width="{{q.w}}" height="{{q.h}}" rx="{{q.rx}}" style="fill: {{q.fill}}; stroke: {{q.stroke}}; stroke-width: {{q.sw}}; stroke-dasharray: {{q.dash}}; opacity: {{q.op}}; animation: {{q.anim}}; transition: fill .8s ease {{q.tdl}}s, stroke .8s ease {{q.tdl}}s, opacity .8s ease {{q.tdl}}s"></rect></sc-if>
<sc-if value="{{q.isPath}}" hint-placeholder-val="{{ false }}"><path d="{{q.d}}" transform="{{q.tf}}" style="fill: {{q.fill}}; stroke: {{q.stroke}}; stroke-width: {{q.sw}}; stroke-dasharray: {{q.dash}}; stroke-linecap: round; stroke-linejoin: round; opacity: {{q.op}}; animation: {{q.anim}}; transition: opacity .8s ease {{q.tdl}}s, stroke .8s ease, fill .8s ease, d .9s ease"></path></sc-if>
<sc-if value="{{q.isCirc}}" hint-placeholder-val="{{ false }}"><circle cx="{{q.cx}}" cy="{{q.cy}}" r="{{q.r}}" style="fill: {{q.fill}}; stroke: {{q.stroke}}; stroke-width: {{q.sw}}; opacity: {{q.op}}; animation: {{q.anim}}; transition: fill .8s ease, opacity .8s ease"></circle></sc-if>
<sc-if value="{{q.isPoly}}" hint-placeholder-val="{{ false }}"><polyline points="{{q.pts}}" style="fill: {{q.fill}}; stroke: {{q.stroke}}; stroke-width: {{q.sw}}; stroke-dasharray: {{q.dash}}; stroke-linecap: round; stroke-linejoin: round; opacity: {{q.op}}; animation: {{q.anim}}"></polyline></sc-if>
</sc-for>
</svg>
<sc-for list="{{a.labels}}" as="lb" hint-placeholder-count="4"><div data-lbl="1" style="position: absolute; left: {{lb.x}}px; top: {{lb.y}}px; transform: translateX({{lb.tx}}%); white-space: nowrap; line-height: 1; font-size: {{lb.fs}}px; font-weight: {{lb.fw}}; font-family: {{lb.font}}; color: {{lb.fill}}; opacity: {{lb.op}}; transition: opacity .8s ease {{lb.tdl}}s, color .8s ease; pointer-events: none">{{lb.txt}}</div></sc-for>
</div>
</sc-if>
<sc-if value="{{a.isText}}" hint-placeholder-val="{{ false }}">
<div style="width: {{a.w}}px; font-size: {{a.fs}}px; font-weight: {{a.fw}}; font-family: {{a.font}}; font-style: {{a.fst}}; line-height: {{a.lh}}; color: {{a.color}}; text-align: {{a.align}}; background: {{a.bg}}; padding: {{a.pad}}; border-radius: {{a.rad}}; border: {{a.bd}}; box-sizing: border-box"><sc-for list="{{a.segs}}" as="sg" hint-placeholder-count="3"><span style="color: {{sg.c}}; font-weight: {{sg.fw}}">{{sg.t}}</span></sc-for></div>
</sc-if>
<sc-if value="{{a.isStat}}" hint-placeholder-val="{{ false }}">
<div style="width: {{a.w}}px; box-sizing: border-box; padding: 20px 22px; border-radius: 18px; background: {{a.bg}}; border: 1px solid {{a.bd}}">
<div class="h" style="font-size: {{a.fs}}px; color: {{a.c}}; line-height: 1; font-weight: 500">{{a.v}}</div>
<div style="font-size: 17px; color: var(--label); margin-top: 10px; line-height: 1.35">{{a.l}}</div>
</div>
</sc-if>
<sc-if value="{{a.isTable}}" hint-placeholder-val="{{ false }}">
<div style="width: {{a.w}}px; font-size: {{a.fs}}px; line-height: 1.35">
<div style="display: grid; grid-template-columns: {{a.cols}}; gap: 0 18px; padding: 0 14px 10px; border-bottom: 2px solid var(--ink); font-weight: 600; color: var(--label); font-size: {{a.hfs}}px"><sc-for list="{{a.head}}" as="hc" hint-placeholder-count="4"><div style="text-align: {{hc.al}}">{{hc.t}}</div></sc-for></div>
<sc-for list="{{a.rows}}" as="r" hint-placeholder-count="5"><div style="display: grid; grid-template-columns: {{a.cols}}; gap: 0 18px; padding: {{a.rpad}}px 14px; border-bottom: 1px solid var(--rule); background: {{r.bg}}; opacity: {{r.op}}; transition: opacity .6s ease, background .6s ease"><sc-for list="{{r.cells}}" as="c" hint-placeholder-count="4"><div style="text-align: {{c.al}}; font-weight: {{c.fw}}; color: {{c.c}}; font-family: {{c.font}}">{{c.t}}</div></sc-for></div></sc-for>
</div>
</sc-if>
<sc-if value="{{a.isBars}}" hint-placeholder-val="{{ false }}">
<div style="width: {{a.w}}px">
<div style="font-size: {{a.tfs}}px; font-weight: 600; margin-bottom: 4px">{{a.title}}</div>
<div style="font-size: 14px; color: var(--muted); margin-bottom: 10px">{{a.sub}}</div>
<sc-for list="{{a.rows}}" as="r" hint-placeholder-count="4"><div style="display: grid; grid-template-columns: {{a.lw}}px minmax(0, 1fr) {{a.vw}}px; align-items: center; gap: 12px; margin: {{a.gap}}px 0; opacity: {{r.op}}; transition: opacity .5s ease"><div style="font-size: {{a.fs}}px; color: var(--label); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.n}}</div><div style="position: relative; height: {{a.bh}}px; border-radius: 6px; background: var(--bg); overflow: hidden"><div style="position: absolute; left: 0; top: 0; bottom: 0; width: {{r.w}}%; border-radius: 6px; background: {{r.c}}; transition: width 1.1s cubic-bezier(.3,0,.2,1) {{r.dl}}s"></div></div><div class="mono" style="font-size: {{a.fs}}px; font-weight: {{r.fw}}; color: {{r.vc}}">{{r.l}}</div></div></sc-for>
</div>
</sc-if>
<sc-if value="{{a.isList}}" hint-placeholder-val="{{ false }}">
<div style="width: {{a.w}}px">
<sc-if value="{{a.hasTitle}}" hint-placeholder-val="{{ false }}"><div style="font-size: {{a.tfs}}px; font-weight: 600; color: {{a.tc}}; margin-bottom: 14px">{{a.title}}</div></sc-if>
<sc-for list="{{a.items}}" as="it" hint-placeholder-count="4"><div style="display: flex; gap: 14px; align-items: flex-start; margin: 0 0 {{a.gap}}px; opacity: {{it.op}}; transform: translateX({{it.dx}}px); transition: opacity .6s ease {{it.dl}}s, transform .6s ease {{it.dl}}s"><div style="flex-shrink: 0; width: {{a.mk}}px; height: {{a.mk}}px; margin-top: {{a.mt}}px; border-radius: 50%; background: {{it.mbg}}; color: {{it.mc}}; border: {{it.mbd}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: {{a.mfs}}px; font-weight: 600">{{it.m}}</div><div style="min-width: 0"><div style="font-size: {{a.fs}}px; font-weight: {{a.tfw}}; line-height: 1.32">{{it.t}}</div><sc-if value="{{it.hasS}}" hint-placeholder-val="{{ false }}"><div style="font-size: {{a.sfs}}px; color: var(--muted); line-height: 1.4; margin-top: 4px">{{it.s}}</div></sc-if></div></div></sc-for>
</div>
</sc-if>
</div>
</sc-for>

<sc-for list="{{sc.caps}}" as="cp" hint-placeholder-count="5">
<div data-cap="1" style="position: absolute; left: 48px; top: {{sc.capTop}}px; width: 1184px; font-size: 23px; line-height: 1.38; opacity: {{cp.op}}; transform: translateY({{cp.dy}}px); transition: opacity .5s ease, transform .5s ease"><sc-for list="{{cp.segs}}" as="sg" hint-placeholder-count="3"><span style="color: {{sg.c}}; font-weight: {{sg.fw}}">{{sg.t}}</span></sc-for><span class="mono" style="display: inline-block; vertical-align: 3px; margin-left: 12px; font-size: 13px; padding: 2px 9px; border-radius: 6px; border: {{cp.cbd}}; color: {{cp.cfg}}; opacity: {{cp.cop}}">{{cp.chip}}</span></div>
</sc-for>

</div>
</sc-for>

</div>
</div>
</div>

<div style="flex-shrink: 0; margin-top: 14px; height: 50px; display: flex; align-items: center; gap: 12px">
<button onClick="{{pl.toggle}}" aria-label="{{pl.playLabel}}" style="width: 46px; height: 46px; flex-shrink: 0; border-radius: 50%; border: none; background: var(--acc); color: #FFFFFF; font-size: 15px">{{pl.icon}}</button>
<button class="btn" onClick="{{pl.prev}}" aria-label="Previous" style="width: 36px; padding: 0; flex-shrink: 0">⏮</button>
<button class="btn" onClick="{{pl.next}}" aria-label="Next" style="width: 36px; padding: 0; flex-shrink: 0">⏭</button>
<div style="flex: 1; min-width: 0; padding: 0 6px">
<div style="display: flex; justify-content: space-between; gap: 16px; font-size: 12.5px; margin-bottom: 7px"><span style="font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{pl.label}}</span><span class="mono" style="color: var(--muted); white-space: nowrap">{{pl.time}}</span></div>
<div style="position: relative; height: 10px; border-radius: 5px; background: var(--rule); overflow: hidden">
<div style="position: absolute; left: 0; top: 0; bottom: 0; width: {{pl.w}}%; background: var(--acc); transition: width {{pl.tr}}s linear"></div>
<div style="position: absolute; inset: 0; display: flex">
<sc-for list="{{pl.segs}}" as="sg" hint-placeholder-count="8"><button class="seg" onClick="{{sg.pick}}" aria-label="Jump to {{sg.name}}" title="{{sg.name}}" style="flex-grow: {{sg.w}}"></button></sc-for>
</div>
</div>
</div>
<div style="position: relative; flex-shrink: 0">
<sc-if value="{{pl.menuOpen}}" hint-placeholder-val="{{ false }}">
<div>
<button onClick="{{pl.menu}}" aria-label="Close speed menu" style="position: fixed; inset: 0; border: none; background: transparent; cursor: default"></button>
<div style="position: absolute; right: 0; bottom: 56px; width: 150px; padding: 8px; box-sizing: border-box; border-radius: 18px; border: 1px solid var(--rule); background: var(--card); box-shadow: 0 14px 34px -8px {{t.sh}}; z-index: 5">
<sc-for list="{{pl.speeds}}" as="sp" hint-placeholder-count="7"><button onClick="{{sp.pick}}" style="display: block; width: 100%; height: 34px; padding: 0 14px; border: none; border-radius: 12px; text-align: left; background: {{sp.bg}}; color: {{sp.fg}}; font-weight: {{sp.fw}}; font-size: 16px; font-family: 'IBM Plex Mono', monospace">{{sp.l}}</button></sc-for>
</div>
</div>
</sc-if>
<button onClick="{{pl.menu}}" aria-label="Playback speed" style="height: 46px; padding: 0 22px; border-radius: 999px; border: 1px solid var(--rule); background: var(--card); color: var(--ink); font-size: 16px; font-family: 'IBM Plex Mono', monospace">{{pl.speedLabel}}<span style="font-size: 11px; margin-left: 8px">▾</span></button>
</div>
</div>
</div>
</template>
<script>
/* paper-film standalone runtime (MIT).
 * Renders the film template without any host runtime:
 *   {{path}} holes in text and attributes, <sc-for list as>, <sc-if value>, onClick="{{fn}}".
 * Re-renders patch the existing DOM in place, so CSS transitions play between beats.
 */
(function () {
  var SVG = 'http://www.w3.org/2000/svg';
  var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  var ONLY = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/;

  function lookup(scope, path) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return +path;
    var parts = path.split('.'), v = scope[parts[0]];
    for (var i = 1; i < parts.length && v != null; i++) v = v[parts[i]];
    return v;
  }
  function interp(str, scope) {
    return str.replace(HOLE, function (_, p) { var v = lookup(scope, p); return v == null ? '' : String(v); });
  }

  // template node -> array of vnodes
  function build(node, scope, inSvg) {
    if (node.nodeType === 3) {
      var t = node.nodeValue;
      if (t.indexOf('{{') < 0) return /\S/.test(t) || t === ' ' ? [{ text: t }] : (t.length ? [{ text: t }] : []);
      return [{ text: interp(t, scope) }];
    }
    if (node.nodeType !== 1) return [];
    var tag = node.localName;
    if (tag === 'sc-for') {
      var m = ONLY.exec(node.getAttribute('list') || ''), list = m ? lookup(scope, m[1]) : null, as = node.getAttribute('as') || 'item';
      var out = [];
      (list || []).forEach(function (item, idx) {
        var s = Object.create(scope); s[as] = item; s.$index = idx;
        kidsOf(node).forEach(function (c) { out.push.apply(out, build(c, s, inSvg)); });
      });
      return out;
    }
    if (tag === 'sc-if') {
      var mv = ONLY.exec(node.getAttribute('value') || ''), ok = mv ? lookup(scope, mv[1]) : false;
      if (!ok) return [];
      var res = [];
      kidsOf(node).forEach(function (c) { res.push.apply(res, build(c, scope, inSvg)); });
      return res;
    }
    var svg = inSvg || tag === 'svg', v = { tag: tag, svg: svg, attrs: {}, on: {}, kids: [] };
    for (var i = 0; i < node.attributes.length; i++) {
      var a = node.attributes[i], name = a.name, val = a.value;
      if (name.indexOf('hint-') === 0) continue;
      if (/^on[A-Z]/.test(name) || /^on[a-z]+$/.test(name)) {
        var mm = ONLY.exec(val); if (mm) v.on[name.slice(2).toLowerCase()] = lookup(scope, mm[1]);
        continue;
      }
      var only = ONLY.exec(val);
      v.attrs[name] = only ? lookup(scope, only[1]) : (val.indexOf('{{') >= 0 ? interp(val, scope) : val);
    }
    kidsOf(node).forEach(function (c) { v.kids.push.apply(v.kids, build(c, scope, svg)); });
    return [v];
  }
  function kidsOf(node) { return Array.prototype.slice.call((node.content || node).childNodes); }

  function create(v) {
    if (v.text != null) { var tn = document.createTextNode(v.text); tn.__v = v; return tn; }
    var el = v.svg ? document.createElementNS(SVG, v.tag) : document.createElement(v.tag);
    el.__v = { tag: v.tag, attrs: {}, on: {}, kids: [] };
    update(el, v);
    return el;
  }
  function setAttr(el, k, val) {
    if (val == null || val === false) { el.removeAttribute(k); return; }
    if (k === 'class') k = 'class';
    el.setAttribute(k, val === true ? '' : String(val));
  }
  function update(el, v) {
    var old = el.__v || { attrs: {}, on: {}, kids: [] };
    for (var k in v.attrs) if (old.attrs[k] !== v.attrs[k]) setAttr(el, k, v.attrs[k]);
    for (var k2 in old.attrs) if (!(k2 in v.attrs)) el.removeAttribute(k2);
    for (var e in v.on) el['on' + e] = typeof v.on[e] === 'function' ? v.on[e] : null;
    for (var e2 in old.on) if (!(e2 in v.on)) el['on' + e2] = null;
    patchKids(el, v.kids);
    el.__v = { tag: v.tag, attrs: v.attrs, on: v.on, kids: v.kids };
  }
  function patchKids(el, kids) {
    var cur = el.childNodes;
    for (var i = 0; i < kids.length; i++) {
      var nv = kids[i], ex = cur[i];
      if (!ex) { el.appendChild(create(nv)); continue; }
      var ov = ex.__v;
      if (nv.text != null) {
        if (ex.nodeType === 3) { if (ex.nodeValue !== nv.text) ex.nodeValue = nv.text; ex.__v = nv; }
        else el.replaceChild(create(nv), ex);
      } else if (ex.nodeType === 1 && ov && ov.tag === nv.tag) update(ex, nv);
      else el.replaceChild(create(nv), ex);
    }
    while (el.childNodes.length > kids.length) el.removeChild(el.lastChild);
  }

  window.DCLogic = function DCLogic(props) { this.props = props || {}; this.state = {}; };
  window.DCLogic.prototype.setState = function (o) {
    Object.assign(this.state, typeof o === 'function' ? o(this.state) : o);
    if (this.__schedule) this.__schedule();
  };
  window.DCLogic.prototype.forceUpdate = function () { if (this.__schedule) this.__schedule(); };

  window.mountFilm = function (Component, tplId, mountId, props) {
    var tpl = document.getElementById(tplId), root = document.getElementById(mountId);
    var comp = new Component(props || {}), queued = false;
    var render = function () {
      queued = false;
      var vals = comp.renderVals(), vnodes = [];
      kidsOf(tpl).forEach(function (n) { vnodes.push.apply(vnodes, build(n, vals, false)); });
      patchKids(root, vnodes.filter(function (v) { return v.text == null || /\S/.test(v.text); }));
    };
    comp.__schedule = function () { if (!queued) { queued = true; requestAnimationFrame(render); } };
    render();
    if (comp.componentDidMount) comp.componentDidMount();
    return comp;
  };
})();

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { theme: null, scene: 0, playing: true, speed: 1, menu: false, frac: 0, scale: this._fit() };
    this._speed = 1;
    var self = this;
    if (typeof window !== 'undefined') {
      var key = '__paperfilm_' + this.pid();
      if (window[key] && window[key] !== this) { window[key]._dead = true; clearTimeout(window[key]._tm); }
      window[key] = this;
      setTimeout(function () { if (!self._dead && self.state.playing) self._schedule(self.state.scene, 0, true); }, 1400);
      window.addEventListener('resize', function () { if (!self._dead) self.setState({ scale: self._fit() }); });
      setTimeout(function () { if (!self._dead) self.setState({ scale: self._fit() }); }, 300);
      document.addEventListener('visibilitychange', function () { if (document.hidden && self.state.playing && !self._dead) self._toggle(); });
    }
  }
  _fit() {
    if (typeof window === 'undefined') return 1;
    var holder = document.getElementById(this.pid() + '-holder');
    var W = holder ? holder.clientWidth : window.innerWidth - 48;
    var H = holder ? holder.clientHeight : window.innerHeight - 190;

ling structured records. You describe the jobs as a *schema*, which becomes special tokens placed before the text. *One forward pass* on a CPU answers every job together. It has the best average zero-shot classification score of the open models tested, and comes close to GPT-4o on entity recognition.", "font": "serif", "fs": 27, "lh": 1.42}, {"id": "s0", "type": "stat", "x": 48, "y": 410, "w": 278, "v": "0.72", "l": "average zero-shot accuracy on 7 classification sets", "op": 0}, {"id": "s1", "type": "stat", "x": 350, "y": 410, "w": 278, "v": "0.590", "l": "entity F1 on CrossNER, vs 0.599 for GPT-4o", "op": 0, "dl": 0.12}, {"id": "s2", "type": "stat", "x": 652, "y": 410, "w": 278, "v": "2.62×", "l": "average speed-up over GPT-4o, running on CPU", "op": 0, "dl": 0.24}, {"id": "s3", "type": "stat", "x": 954, "y": 410, "w": 278, "v": "163 ms", "l": "for 20 labels, vs 6,758 ms for DeBERTa-v3", "op": 0, "dl": 0.36}], "beats": [{"cap": "Everything in this film expands this one paragraph.", "kind": "ours", "read": 6}, {"cap": "Four numbers to remember. The Evidence chapter shows how each one was measured.", "src": "Tables 2–4", "set": {"s0": {"op": 1}, "s1": {"op": 1}, "s2": {"op": 1}, "s3": {"op": 1}}, "read": 3}]}], "card": false}, {"n": "01", "name": "The problem", "short": "Problem", "lede": "Extraction needed a GPU, an outside API, or a separate small model for every task.", "scenes": [{"title": "Text in, structured data out", "actors": [{"id": "em", "type": "text", "x": 48, "y": 160, "w": 520, "text": "“Hi, this is Dana Reyes from Northwind. Order 4471 for 2 laptops arrived damaged. I want a refund.”", "font": "serif", "fs": 24, "lh": 1.4, "box": "plain"}, {"id": "el", "type": "text", "x": 48, "y": 330, "w": 520, "text": "one support email (our example)", "fs": 14, "tone": "muted", "font": "mono"}, {"id": "ar", "type": "beam", "x": 0, "y": 0, "pts": "590,230 660,230", "op": 0}, {"id": "o1", "type": "text", "x": 680, "y": 160, "w": 552, "text": "*Entities*  person: Dana Reyes · company: Northwind", "fs": 19, "box": "plain", "op": 0}, {"id": "o2", "type": "text", "x": 680, "y": 240, "w": 552, "text": "*Class*  intent: refund request · sentiment: negative", "fs": 19, "box": "plain", "op": 0}, {"id": "o3", "type": "text", "x": 680, "y": 320, "w": 552, "text": "*Record*  order { id: 4471, item: laptop, qty: 2 }", "fs": 19, "box": "plain", "font": "mono", "op": 0}, {"id": "n", "type": "text", "x": 48, "y": 440, "w": 1184, "text": "Information extraction turns unstructured text into structured data a program can use.", "fs": 22, "box": "acc", "op": 0}], "beats": [{"cap": "Products receive text all day: emails, chats, contracts, records. Programs need fields, not prose.", "kind": "ours"}, {"cap": "So we want the entities: who is writing, and which company.", "src": "§1", "set": {"ar": {"op": 1}, "o1": {"op": 1}}}, {"cap": "We want labels for the whole text, like intent and sentiment.", "src": "§1", "set": {"o2": {"op": 1}}}, {"cap": "And we want records with fields, sometimes several of them in one text.", "src": "§1", "set": {"o3": {"op": 1}}}, {"cap": "This is information extraction: finding structured information in unstructured text.", "src": "§1", "set": {"n": {"op": 1}}}]}, {"title": "Option 1: ask a large language model", "actors": [{"id": "ol", "type": "card", "x": 48, "y": 165, "w": 540, "h": 34, "icon": "gpu", "label": "Open LLMs · 7B to 175B parameters"}, {"id": "cl", "type": "card", "x": 672, "y": 165, "w": 560, "h": 34, "icon": "net", "label": "Closed LLMs · behind an API"}, {"id": "og", "type": "list", "x": 48, "y": 230, "w": 540, "items": [{"t": "Needs a GPU", "s": "Even Llama-2-7B is too slow on CPU for production"}, {"t": "GPUs are scarce", "s": "A barrier for teams with small budgets"}], "upto": 0, "fs": 20, "gap": 18, "mark": "cross", "mk": 28, "sfs": 15}, {"id": "cg", "type": "list", "x": 672, "y": 230, "w": 560, "items": [{"t": "Data leaves your servers", "s": "PII, financial and business records"}, {"t": "Rules may forbid it", "s": "GDPR, HIPAA, on-premises requirements"}, {"t": "You pay on every call", "s": "Recurring API cost"}], "upto": 0, "fs": 20, "gap": 18, "mark": "cross", "mk": 28, "sfs": 15}, {"id": "ok", "type": "text", "x": 48, "y": 510, "w": 1184, "text": "LLMs extract well. The cost is in *how* you have to run them.", "fs": 21, "box": "plain", "op": 0}], "beats": [{"cap": "Large language models do many extraction tasks well.", "src": "§1"}, {"cap": "Open models need a GPU. Even a 7B model is too slow on CPU for production use.", "src": "§1, Table 1", "set": {"og": {"upto": 2}}, "read": 2}, {"cap": "Closed models run behind an API. Sensitive text must leave your servers, and every call costs money.", "src": "§1, Table 1", "set": {"cg": {"upto": 3}}, "read": 2}, {"cap": "Healthcare, finance and government teams often must keep data on their own machines.", "src": "§1", "set": {"ok": {"op": 1}}}]}, {"title": "Option 2: one small model per task", "actors": [{"id": "g", "type": "text", "x": 48, "y": 150, "w": 1184, "text": "GLiNER: a small encoder, prompted with entity types, runs on CPU and matches LLMs on entity recognition.", "fs": 20, "box": "plain"}, {"id": "m0", "type": "card", "x": 48, "y": 240, "w": 380, "h": 34, "icon": "box3d", "label": "GLiNER · entities (NER)", "op": 1}, {"id": "m1", "type": "card", "x": 450, "y": 240, "w": 380, "h": 34, "icon": "box3d", "label": "GLiREL · relations", "op": 0}, {"id": "m2", "type": "card", "x": 852, "y": 240, "w": 380, "h": 34, "icon": "box3d", "label": "GLiClass · text classes", "op": 0}, {"id": "m3", "type": "card", "x": 48, "y": 300, "w": 380, "h": 34, "icon": "box3d", "label": "GLiNER-BioMed · biomedical entities", "op": 0}, {"id": "m4", "type": "card", "x": 450, "y": 300, "w": 380, "h": 34, "icon": "box3d", "label": "GLiDRE · French document relations", "op": 0}, {"id": "m5", "type": "card", "x": 852, "y": 300, "w": 380, "h": 34, "icon": "box3d", "label": "spaCy · Stanza · CoreNLP · one model per task", "op": 0}, {"i text": "Each new task meant another model", "font": "serif", "fs": 34, "lh": 1.1, "op": 0}, {"id": "p0e0", "type": "text", "x": 48, "y": 236, "w": 560, "text": "*Stated*  LLMs need GPUs or APIs, which raise privacy and cost problems.  (§1)", "fs": 19, "box": "ok", "op": 0}, {"id": "p0e1", "type": "text", "x": 48, "y": 328, "w": 560, "text": "*Stated*  Each GLiNER adaptation needed its own model, so pipelines fragmented.  (§1)", "fs": 19, "box": "ok", "op": 0}, {"id": "p0e2", "type": "text", "x": 48, "y": 420, "w": 560, "text": "*Inferred*  Small encoders already worked; the cost was how many of them a team ran.", "fs": 19, "box": "ours", "op": 0}, {"id": "p0x", "type": "text", "x": 48, "y": 236, "w": 560, "text": "*Works for*  Several linters each parsing the same file; services that each re-parse a request.", "fs": 19, "box": "plain", "op": 0}, {"id": "p0f", "type": "text", "x": 48, "y": 328, "w": 560, "text": "*Stops working when*  The tasks conflict, so sharing one model makes each worse.", "fs": 19, "box": "plain", "op": 0}, {"id": "p0r0", "type": "text", "x": 652, "y": 496, "w": 580, "text": "*What they did*  Set the goal: one CPU model for entities, classes and records.", "fs": 20, "box": "plain", "op": 0}, {"id": "p0r2", "type": "text", "x": 652, "y": 400, "w": 580, "text": "*In any field*  When every fix is a new specialist, count the specialists as the cost.", "fs": 20, "box": "plain", "op": 0}, {"id": "p0r3", "type": "text", "x": 652, "y": 304, "w": 580, "text": "*Ask*  How many separate tools run on the same input in my system?", "fs": 20, "box": "acc", "op": 0}], "beats": [{"cap": "Each new task meant another model.", "src": "§1", "read": 6, "set": {"p0t": {"op": 1}, "p0e0": {"op": 1}, "p0e1": {"op": 1}, "p0e2": {"op": 1}, "ppv": {"op": 0}}}, {"cap": "When every fix is a new specialist, count the specialists as the cost.", "kind": "ours", "read": 4, "set": {"p0r0": {"op": 1}, "p0r2": {"op": 1}}}, {"cap": "Ask: How many separate tools run on the same input in my system?", "kind": "ours", "read": 7, "set": {"p0e0": {"op": 0}, "p0e1": {"op": 0}, "p0e2": {"op": 0}, "p0r3": {"op": 1}, "p0x": {"op": 1}, "p0f": {"op": 1}}}]}, {"title": "How they shaped the solution", "actors": [{"id": "dpv", "type": "text", "x": 48, "y": 146, "w": 400, "text": "THE PIVOT", "font": "mono", "fs": 14, "tone": "acc", "op": 0}, {"id": "d0t", "type": "text", "x": 48, "y": 168, "w": 1184, "text": "Turn every task into a prompt", "font": "serif", "fs": 34, "lh": 1.1, "op": 0}, {"id": "d0e0", "type": "text", "x": 48, "y": 236, "w": 560, "text": "*Stated*  GLiNER prompts an encoder with entity types; GLiNER2 extends this to schemas for many tasks.  (§2)", "fs": 19, "box": "ok", "op": 0}, {"id": "d0e1", "type": "text", "x": 48, "y": 328, "w": 560, "text": "*Stated*  The core change is one input format built from prompt templates.  (§2)", "fs": 19, "box": "ok", "op": 0}, {"id": "d0e2", "type": "text", "x": 48, "y": 420, "w": 560, "text": "*Shown*  Entity F1 stays within 0.025 of GLiNER-M while adding tasks.  (Table 3)", "fs": 19, "box": "acc", "op": 0}, {"id": "d0x", "type": "text", "x": 48, "y": 236, "w": 560, "text": "*Works for*  A SQL engine that runs any query; a template renderer.", "fs": 19, "box": "plain", "op": 0}, {"id": "d0f", "type": "text", "x": 48, "y": 328, "w": 560, "text": "*Stops working when*  A task needs a kind of output the shared engine cannot give.", "fs": 19, "box": "plain", "op": 0}, {"id": "d0r0", "type": "text", "x": 652, "y": 496, "w": 580, "text": "*What they did*  Task prompt, [SEP], then the text, with [P], [E], [C] and [L] tokens.", "fs": 20, "box": "plain", "op": 0}, {"id": "d0r2", "type": "text", "x": 652, "y": 400, "w": 580, "text": "*In any field*  Make the request part of the data, so one engine serves many requests.", "fs": 20, "box": "plain", "op": 0}, {"id": "d0r3", "type": "text", "x": 652, "y": 304, "w": 580, "text": "*Ask*  Could my separate jobs become one job, with the difference passed in?", "fs": 20, "box": "acc", "op": 0}, {"id": "d1t", "type": "text", "x": 48, "y": 168, "w": 1184, "text": "Score all labels in one pass", "font": "serif", "fs": 34, "lh": 1.1, "op": 0}, {"id": "d1e0", "type": "text", "x": 48, "y": 236, "w": 560, "text": "*Stated*  DeBERTa runs a pass per label, so its time grows with the label count.  (§3.3)", "fs": 19, "box": "ok", "op": 0}, {"id": "d1e1", "type": "text", "x": 48, "y": 328, "w": 560, "text": "*Shown*  5 to 50 labels: GLiNER2 130 to 208 ms, DeBERTa 1,714 to 16,897 ms.  (Table 4)", "fs": 19, "box": "acc", "op": 0}, {"id": "d1x", "type": "text", "x": 48, "y": 236, "w": 560, "text": "*Works for*  One table scan for many aggregates; checking all rules on a request at once.", "fs": 19, "box": "plain", "op": 0}, {"id": "d1f", "type": "text", "x": 48, "y": 328, "w": 560, "text": "*Stops working when*  Input plus all questions no longer fit (2,048 tokens).", "fs": 19, "box": "plain", "op": 0}, {"id": "d1r0", "type": "text", "x": 652, "y": 496, "w": 580, "text": "*What they did*  All [L] tokens sit in one input; one pass gives a logit per label.", "fs": 20, "box": "plain", "op": 0}, {"id": "d1r2", "type": "text", "x": 652, "y": 400, "w": 580, "text": "*In any field*  Read the data once for all questions, not once per question.", "fs": 20, "box": "plain", "op": 0}, {"id": "d1r3", "type": "text", "x": 652, "y": 304, "w": 580, "text": "*Ask*  Where do I re-read the same input once per option?", "fs": 20, "box": "acc", "op": 0}, {"id": "d2t", "type": "text", "x": 48, "y": 168, "w": 1184, "text": "Count the records before filling them", "font": "serif", "fs": 34, "lh": 1.1, "op": 0}, {"id": "d2e0", "type": "text", "x": 48, "y": 236, "w": 560, "text": "*Stated*  An MLP predicts the count K from [P]; [C] vectors get record-number vectors.  (App. A)", "fs": 19, "box": "ok", "op": 0}, {"id": "d2e1", "type": "text", "x": 48, "y": 328, "w": 560, "text": "*Stated*  This keeps each record’s field values apart.  (App. A)", "fs": 19, "box": "ok", "op": 0}, {"id": "d2x", "type": "text", "x": 48, "y": 236, "w": 560, "text": "*Works for*  Line items on an invoice; allocating slots before a batch job.", "fs": 19, "box": "plain", "op": 0}, {"id": "d2f", "type": "text", "x": 48, "y": 328, "w": 560, "text": "*Stops working when*  The count passes the cap (19) or is unclear.", "fs": 19, "box": "plain", "op": 0}, {"id": "d2r0", "type": "text", "x": 652, "y": 496, "w": 580, "text": "*What they did*  Predict K (0 to 19), build K × m field vectors, match each to a span.", "fs": 20, "box": "plain", "op": 0}, {"id": "d2r2", "type": "text", "x": 652, "y": 400, "w": 580, "text": "*In any field*  Decide how many things there are before filling in their details.", "fs": 20, "box": "plain", "op": 0}, {"id": "d2r3", "type": "text", "x": 652, "y": 304, "w": 580, "text": "*Ask*  When my output repeats, do I know how many items first?", "fs": 20, "box": "acc", "op": 0}, {"id": "qs", "type": "list", "x": 120, "y": 236, "w": 1040, "items": [{"t": "How many separate tools run on the same input in my system?", "s": "Each new task meant another model"}, {"t": "Could my separate jobs become one job, with the difference passed in?", "s": "Turn every task into a prompt"}, {"t": "Where do I re-read the same input once per option?", "s": "Score all labels in one pass"}, {"t": "When my output repeats, do I know how many items first?", "s": "Count the records before filling them"}], "upto": 0, "fs": 20, "gap": 10, "op": 0, "sfs": 15, "mk": 28}], "beats": [{"cap": "Turn every task into a prompt.", "src": "§2, Table 3", "read": 6, "set": {"d0t": {"op": 1}, "d0e0": {"op": 1}, "d0e1": {"op": 1}, "d0e2": {"op": 1}, "dpv": {"op": 1}}}, {"cap": "Make the request part of the data, so one engine serves many requests.", "kind": "ours", "read": 4, "set": {"d0r0": {"op": 1}, "d0r2": {"op": 1}}}, {"cap": "Ask: Could my separate jobs become one job, with the difference passed in?", "kind": "ours", "read": 7, "set": {"d0e0": {"op": 0}, "d0e1": {"op": 0}, "d0e2": {"
