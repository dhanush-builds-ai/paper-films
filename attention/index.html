<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attention Is All You Need · paper film</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&amp;family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
html,body{height:100%}
#film{height:100vh}
body{margin:0}
button{cursor:pointer;font-family:inherit}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes plpulse{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes plflow{to{stroke-dashoffset:-26}}
@keyframes plblink{0%,100%{opacity:.15}50%{opacity:1}}
.h{font-family:'Newsreader',serif}
.mono{font-family:'IBM Plex Mono',monospace}
.btn{height:34px;padding:0 13px;border-radius:8px;border:1px solid var(--rule);background:var(--card);font-size:13.5px;color:var(--ink)}
.seg{height:100%;border:none;padding:0;background:transparent;border-right:2px solid var(--card)}
.seg:hover{background:rgba(0,0,0,.08)}
.chap{height:32px;padding:0 12px;border-radius:999px;font-size:13px;white-space:nowrap}
</style>
</head>
<body>
<div id="film"></div>
<template id="film-tpl">
<div style="--bg: {{t.bg}}; --card: {{t.card}}; --ink: {{t.ink}}; --muted: {{t.muted}}; --label: {{t.label}}; --rule: {{t.rule}}; --acc: {{accent}}; --accsoft: {{accSoft}}; width: 100%; height: 100%; min-height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; background: {{t.page}}; color: var(--ink); font-family: 'IBM Plex Sans', sans-serif; padding: 14px 24px 16px; overflow: hidden">

<div data-topbar="1" style="flex-shrink: 0; display: flex; align-items: flex-end; gap: 20px; padding: 4px 4px 0; min-width: 0">
<div data-papertitle="1" style="min-width: 0; flex: 1 1 auto">
<div class="h" style="font-size: 26px; line-height: 1.2; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{meta.title}}</div>
<div style="margin-top: 5px; font-size: 14px; line-height: 1.3; color: var(--label); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{meta.line}}</div>
</div>
<div style="display: flex; gap: 8px; flex-shrink: 0; padding-bottom: 2px">
<sc-for list="{{meta.links}}" as="lk" hint-placeholder-count="2"><a href="{{lk.u}}" target="_blank" rel="noopener" style="height: 32px; display: inline-flex; align-items: center; padding: 0 14px; border-radius: 999px; border: 1px solid var(--rule); background: var(--card); color: var(--acc); font-size: 13.5px; text-decoration: none">{{lk.t}} ↗</a></sc-for>
</div>
</div>
<div data-chips="1" style="flex-shrink: 0; min-width: 0; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; margin: 14px 0 10px; padding: 0 4px">
<div style="display: flex; gap: 6px; width: max-content">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="8"><button class="chap" onClick="{{c.pick}}" style="border: 1px solid {{c.bd}}; background: {{c.bg}}; color: {{c.fg}}; font-weight: {{c.fw}}"><span class="mono" style="font-size: 11px; opacity: .7; margin-right: 6px">{{c.n}}</span>{{c.name}}</button></sc-for>
</div>
</div>

<div id="{{pid}}-holder" style="flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 6px 0 22px">
<div style="position: relative; width: {{stW}}px; height: {{stH}}px; flex-shrink: 0">
<div data-stage="1" style="--tf: {{tf}}; position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform: scale({{scale}}); transform-origin: 0 0; background: var(--card); border-radius: 22px; outline: 1px solid {{t.edge}}; box-shadow: 0 1px 2px {{t.shSoft}}, 0 6px 16px -6px {{t.shSoft}}, 0 24px 48px -12px {{t.sh}}, 0 60px 90px -40px {{t.shDeep}}; overflow: hidden">

<sc-for list="{{scenes}}" as="sc" hint-placeholder-count="6">
<div data-scene="1" style="position: absolute; inset: 0; opacity: {{sc.op}}; transition: opacity calc(.7s * var(--tf)) ease; pointer-events: {{sc.pe}}">

<div style="position: absolute; left: 0; right: 0; top: 0; height: 196px; background: {{t.band}}; border-bottom: 1px solid {{t.rule}}; opacity: {{sc.band}}"></div>
<div class="mono" style="position: absolute; left: 48px; top: 26px; font-size: 13px; letter-spacing: .08em; color: var(--acc); text-transform: uppercase">{{sc.tag}}</div>
<div data-headline="1" class="h" style="position: absolute; left: 48px; top: 46px; width: 1000px; font-size: 34px; line-height: 1.12; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{sc.title}}</div>
<div style="position: absolute; right: 48px; top: 32px; display: flex; gap: 6px; align-items: center">
<sc-for list="{{sc.dots}}" as="dt" hint-placeholder-count="6"><button onClick="{{dt.pick}}" aria-label="Beat {{dt.no}}" style="width: {{dt.w}}px; height: 8px; border-radius: 4px; border: none; padding: 0; background: {{dt.bg}}; transition: width calc(.4s * var(--tf)), background calc(.4s * var(--tf))"></button></sc-for>
</div>

<sc-for list="{{sc.actors}}" as="a" hint-placeholder-count="12">
<div data-actor="{{a.id}}" data-type="{{a.type}}" style="position: absolute; left: 0; top: 0; width: {{a.w}}px; transform: translate({{a.x}}px, {{a.y}}px) scale({{a.s}}); transform-origin: 0 0; opacity: {{a.op}}; transition: transform calc(1.2s * var(--tf)) cubic-bezier(.45,0,.2,1) calc({{a.dl}}s * var(--tf)), opacity calc(.8s * var(--tf)) ease calc({{a.dl}}s * var(--tf))">
<sc-if value="{{a.isSvg}}" hint-placeholder-val="{{ false }}">
<div style="position: relative; width: {{a.w}}px; height: {{a.h}}px; animation: {{a.anim}}">
<svg width="{{a.w}}" height="{{a.h}}" viewBox="0 0 {{a.w}} {{a.h}}" style="overflow: visible; display: block">
<sc-for list="{{a.prims}}" as="q" hint-placeholder-count="8">
<sc-if value="{{q.isRect}}" hint-placeholder-val="{{ false }}"><rect x="{{q.x}}" y="{{q.y}}" width="{{q.w}}" height="{{q.h}}" rx="{{q.rx}}" style="fill: {{q.fill}}; stroke: {{q.stroke}}; stroke-width: {{q.sw}}; stroke-dasharray: {{q.dash}}; opacity: {{q.op}}; animation: {{q.anim}}; transition: fill calc(.8s * var(--tf)) ease calc({{q.tdl}}s * var(--tf)), stroke calc(.8s * var(--tf)) ease calc({{q.tdl}}s * var(--tf)), opacity calc(.8s * var(--tf)) ease calc({{q.tdl}}s * var(--tf))"></rect></sc-if>
<sc-if value="{{q.isPath}}" hint-placeholder-val="{{ false }}"><path d="{{q.d}}" transform="{{q.tf}}" style="fill: {{q.fill}}; stroke: {{q.stroke}}; stroke-width: {{q.sw}}; stroke-dasharray: {{q.dash}}; stroke-linecap: round; stroke-linejoin: round; opacity: {{q.op}}; animation: {{q.anim}}; transition: opacity calc(.8s * var(--tf)) ease calc({{q.tdl}}s * var(--tf)), stroke calc(.8s * var(--tf)) ease, fill calc(.8s * var(--tf)) ease, d calc(.9s * var(--tf)) ease"></path></sc-if>
<sc-if value="{{q.isCirc}}" hint-placeholder-val="{{ false }}"><circle cx="{{q.cx}}" cy="{{q.cy}}" r="{{q.r}}" style="fill: {{q.fill}}; stroke: {{q.stroke}}; stroke-width: {{q.sw}}; opacity: {{q.op}}; animation: {{q.anim}}; transition: fill calc(.8s * var(--tf)) ease, opacity calc(.8s * var(--tf)) ease"></circle></sc-if>
<sc-if value="{{q.isPoly}}" hint-placeholder-val="{{ false }}"><polyline points="{{q.pts}}" style="fill: {{q.fill}}; stroke: {{q.stroke}}; stroke-width: {{q.sw}}; stroke-dasharray: {{q.dash}}; stroke-linecap: round; stroke-linejoin: round; opacity: {{q.op}}; animation: {{q.anim}}"></polyline></sc-if>
</sc-for>
</svg>
<sc-for list="{{a.labels}}" as="lb" hint-placeholder-count="4"><div data-lbl="1" style="position: absolute; left: {{lb.x}}px; top: {{lb.y}}px; transform: translateX({{lb.tx}}%); white-space: nowrap; line-height: 1; font-size: {{lb.fs}}px; font-weight: {{lb.fw}}; font-family: {{lb.font}}; color: {{lb.fill}}; opacity: {{lb.op}}; transition: opacity calc(.8s * var(--tf)) ease calc({{lb.tdl}}s * var(--tf)), color calc(.8s * var(--tf)) ease; pointer-events: none">{{lb.txt}}</div></sc-for>
</div>
</sc-if>
<sc-if value="{{a.isText}}" hint-placeholder-val="{{ false }}">
<div style="width: {{a.w}}px; font-size: {{a.fs}}px; font-weight: {{a.fw}}; font-family: {{a.font}}; font-style: {{a.fst}}; line-height: {{a.lh}}; color: {{a.color}}; text-align: {{a.align}}; background: {{a.bg}}; padding: {{a.pad}}; border-radius: {{a.rad}}; border: {{a.bd}}; box-sizing: border-box"><sc-for list="{{a.segs}}" as="sg" hint-placeholder-count="3"><span style="color: {{sg.c}}; font-weight: {{sg.fw}}">{{sg.t}}</span></sc-for></div>
</sc-if>
<sc-if value="{{a.isStat}}" hint-placeholder-val="{{ false }}">
<div style="width: {{a.w}}px; box-sizing: border-box; padding: 20px 22px; border-radius: 18px; background: {{a.bg}}; border: 1px solid {{a.bd}}">
<div class="h" style="font-size: {{a.fs}}px; color: {{a.c}}; line-height: 1; font-weight: 500">{{a.v}}</div>
<div style="font-size: 17px; color: var(--label); margin-top: 10px; line-height: 1.35">{{a.l}}</div>
</div>
</sc-if>
<sc-if value="{{a.isTable}}" hint-placeholder-val="{{ false }}">
<div style="width: {{a.w}}px; font-size: {{a.fs}}px; line-height: 1.35">
<div style="display: grid; grid-template-columns: {{a.cols}}; gap: 0 18px; padding: 0 14px 10px; border-bottom: 2px solid var(--ink); font-weight: 600; color: var(--label); font-size: {{a.hfs}}px"><sc-for list="{{a.head}}" as="hc" hint-placeholder-count="4"><div style="text-align: {{hc.al}}">{{hc.t}}</div></sc-for></div>
<sc-for list="{{a.rows}}" as="r" hint-placeholder-count="5"><div style="display: grid; grid-template-columns: {{a.cols}}; gap: 0 18px; padding: {{a.rpad}}px 14px; border-bottom: 1px solid var(--rule); background: {{r.bg}}; opacity: {{r.op}}; transition: opacity calc(.6s * var(--tf)) ease, background calc(.6s * var(--tf)) ease"><sc-for list="{{r.cells}}" as="c" hint-placeholder-count="4"><div style="text-align: {{c.al}}; font-weight: {{c.fw}}; color: {{c.c}}; font-family: {{c.font}}">{{c.t}}</div></sc-for></div></sc-for>
</div>
</sc-if>
<sc-if value="{{a.isBars}}" hint-placeholder-val="{{ false }}">
<div style="width: {{a.w}}px">
<div style="font-size: {{a.tfs}}px; font-weight: 600; margin-bottom: 4px">{{a.title}}</div>
<div style="font-size: 14px; color: var(--muted); margin-bottom: 10px">{{a.sub}}</div>
<sc-for list="{{a.rows}}" as="r" hint-placeholder-count="4"><div style="display: grid; grid-template-columns: {{a.lw}}px minmax(0, 1fr) {{a.vw}}px; align-items: center; gap: 12px; margin: {{a.gap}}px 0; opacity: {{r.op}}; transition: opacity calc(.5s * var(--tf)) ease"><div style="font-size: {{a.fs}}px; color: var(--label); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.n}}</div><div style="position: relative; height: {{a.bh}}px; border-radius: 6px; background: var(--bg); overflow: hidden"><div style="position: absolute; left: 0; top: 0; bottom: 0; width: {{r.w}}%; border-radius: 6px; background: {{r.c}}; transition: width calc(1.1s * var(--tf)) cubic-bezier(.3,0,.2,1) calc({{r.dl}}s * var(--tf))"></div></div><div class="mono" style="font-size: {{a.fs}}px; font-weight: {{r.fw}}; color: {{r.vc}}">{{r.l}}</div></div></sc-for>
</div>
</sc-if>
<sc-if value="{{a.isList}}" hint-placeholder-val="{{ false }}">
<div style="width: {{a.w}}px">
<sc-if value="{{a.hasTitle}}" hint-placeholder-val="{{ false }}"><div style="font-size: {{a.tfs}}px; font-weight: 600; color: {{a.tc}}; margin-bottom: 14px">{{a.title}}</div></sc-if>
<sc-for list="{{a.items}}" as="it" hint-placeholder-count="4"><div style="display: flex; gap: 14px; align-items: flex-start; margin: 0 0 {{a.gap}}px; opacity: {{it.op}}; transform: translateX({{it.dx}}px); transition: opacity calc(.6s * var(--tf)) ease calc({{it.dl}}s * var(--tf)), transform calc(.6s * var(--tf)) ease calc({{it.dl}}s * var(--tf))"><div style="flex-shrink: 0; width: {{a.mk}}px; height: {{a.mk}}px; margin-top: {{a.mt}}px; border-radius: 50%; background: {{it.mbg}}; color: {{it.mc}}; border: {{it.mbd}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: {{a.mfs}}px; font-weight: 600">{{it.m}}</div><div style="min-width: 0"><div style="font-size: {{a.fs}}px; font-weight: {{a.tfw}}; line-height: 1.32">{{it.t}}</div><sc-if value="{{it.hasS}}" hint-placeholder-val="{{ false }}"><div style="font-size: {{a.sfs}}px; color: var(--muted); line-height: 1.4; margin-top: 4px">{{it.s}}</div></sc-if></div></div></sc-for>
</div>
</sc-if>
</div>
</sc-for>

<sc-for list="{{sc.caps}}" as="cp" hint-placeholder-count="5">
<div data-cap="1" style="position: absolute; left: 48px; top: {{sc.capTop}}px; width: 1184px; font-size: 23px; line-height: 1.38; opacity: {{cp.op}}; transform: translateY({{cp.dy}}px); transition: opacity calc(.5s * var(--tf)) ease, transform calc(.5s * var(--tf)) ease"><sc-for list="{{cp.segs}}" as="sg" hint-placeholder-count="3"><span style="color: {{sg.c}}; font-weight: {{sg.fw}}">{{sg.t}}</span></sc-for><span class="mono" style="display: inline-block; vertical-align: 3px; margin-left: 12px; font-size: 13px; padding: 2px 9px; border-radius: 6px; border: {{cp.cbd}}; color: {{cp.cfg}}; opacity: {{cp.cop}}">{{cp.chip}}</span></div>
</sc-for>

</div>
</sc-for>

</div>
</div>
</div>

<div style="flex-shrink: 0; margin-top: 14px; height: 50px; display: flex; align-items: center; gap: 12px">
<button onClick="{{pl.toggle}}" aria-label="{{pl.playLabel}}" style="width: 46px; height: 46px; flex-shrink: 0; border-radius: 50%; border: none; background: var(--acc); color: #FFFFFF; font-size: 15px">{{pl.icon}}</button>
<button class="btn" onClick="{{pl.prev}}" aria-label="Previous" style="width: 36px; padding: 0; flex-shrink: 0">⏮</button>
<button class="btn" onClick="{{pl.next}}" aria-label="Next" style="width: 36px; padding: 0; flex-shrink: 0">⏭</button>
<div style="flex: 1; min-width: 0; padding: 0 6px">
<div style="display: flex; justify-content: space-between; gap: 16px; font-size: 12.5px; margin-bottom: 7px"><span style="font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{pl.label}}</span><span class="mono" style="color: var(--muted); white-space: nowrap">{{pl.time}}</span></div>
<div style="position: relative; height: 10px; border-radius: 5px; background: {{t.track}}; overflow: hidden">
<div style="position: absolute; left: 0; top: 0; bottom: 0; width: {{pl.w}}%; background: var(--acc); transition: width {{pl.tr}}s linear"></div>
<div style="position: absolute; inset: 0; display: flex">
<sc-for list="{{pl.segs}}" as="sg" hint-placeholder-count="8"><button class="seg" onClick="{{sg.pick}}" aria-label="Jump to {{sg.name}}" title="{{sg.name}}" style="flex-grow: {{sg.w}}"></button></sc-for>
</div>
</div>
</div>
<div style="display: flex; align-items: center; gap: 4px; flex-shrink: 0">
<div style="position: relative">
<button onClick="{{pl.toggleSpeed}}" aria-label="Playback speed, now {{pl.speedLabel}}" style="height: 36px; min-width: 64px; padding: 0 12px; border-radius: 999px; border: 1px solid {{pl.speedBd}}; background: var(--card); color: var(--ink); font-size: 13px; font-family: 'IBM Plex Mono', monospace">{{pl.speedLabel}} ▾</button>
<sc-if value="{{pl.speedOpen}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; right: 0; bottom: 44px; z-index: 30; min-width: 96px; padding: 6px; border-radius: 12px; border: 1px solid var(--rule); background: var(--card); box-shadow: 0 12px 28px -8px {{t.sh}}; display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{pl.speeds}}" as="sp" hint-placeholder-count="7"><button onClick="{{sp.pick}}" style="height: 30px; padding: 0 12px; border: none; border-radius: 8px; text-align: left; background: {{sp.bg}}; color: {{sp.fg}}; font-weight: {{sp.fw}}; font-size: 13px; font-family: 'IBM Plex Mono', monospace">{{sp.l}}</button></sc-for>
</div>
</sc-if>
</div>
</div>
</div>
</div>
</template>
<script>
/* paper-film standalone runtime (MIT).
 * Renders the film template without any host runtime:
 *   {{path}} holes in text and attributes, <sc-for list as>, <sc-if value>, onClick="{{fn}}".
 * Re-renders patch the existing DOM in place, so CSS transitions play between beats.
 */
(function () {
  var SVG = 'http://www.w3.org/2000/svg';
  var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  var ONLY = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/;

  function lookup(scope, path) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return +path;
    var parts = path.split('.'), v = scope[parts[0]];
    for (var i = 1; i < parts.length && v != null; i++) v = v[parts[i]];
    return v;
  }
  function interp(str, scope) {
    return str.replace(HOLE, function (_, p) { var v = lookup(scope, p); return v == null ? '' : String(v); });
  }

  // template node -> array of vnodes
  function build(node, scope, inSvg) {
    if (node.nodeType === 3) {
      var t = node.nodeValue;
      if (t.indexOf('{{') < 0) return /\S/.test(t) || t === ' ' ? [{ text: t }] : (t.length ? [{ text: t }] : []);
      return [{ text: interp(t, scope) }];
    }
    if (node.nodeType !== 1) return [];
    var tag = node.localName;
    if (tag === 'sc-for') {
      var m = ONLY.exec(node.getAttribute('list') || ''), list = m ? lookup(scope, m[1]) : null, as = node.getAttribute('as') || 'item';
      var out = [];
      (list || []).forEach(function (item, idx) {
        var s = Object.create(scope); s[as] = item; s.$index = idx;
        kidsOf(node).forEach(function (c) { out.push.apply(out, build(c, s, inSvg)); });
      });
      return out;
    }
    if (tag === 'sc-if') {
      var mv = ONLY.exec(node.getAttribute('value') || ''), ok = mv ? lookup(scope, mv[1]) : false;
      if (!ok) return [];
      var res = [];
      kidsOf(node).forEach(function (c) { res.push.apply(res, build(c, scope, inSvg)); });
      return res;
    }
    var svg = inSvg || tag === 'svg', v = { tag: tag, svg: svg, attrs: {}, on: {}, kids: [] };
    for (var i = 0; i < node.attributes.length; i++) {
      var a = node.attributes[i], name = a.name, val = a.value;
      if (name.indexOf('hint-') === 0) continue;
      if (/^on[A-Z]/.test(name) || /^on[a-z]+$/.test(name)) {
        var mm = ONLY.exec(val); if (mm) v.on[name.slice(2).toLowerCase()] = lookup(scope, mm[1]);
        continue;
      }
      var only = ONLY.exec(val);
      v.attrs[name] = only ? lookup(scope, only[1]) : (val.indexOf('{{') >= 0 ? interp(val, scope) : val);
    }
    kidsOf(node).forEach(function (c) { v.kids.push.apply(v.kids, build(c, scope, svg)); });
    return [v];
  }
  function kidsOf(node) { return Array.prototype.slice.call((node.content || node).childNodes); }

  function create(v) {
    if (v.text != null) { var tn = document.createTextNode(v.text); tn.__v = v; return tn; }
    var el = v.svg ? document.createElementNS(SVG, v.tag) : document.createElement(v.tag);
    el.__v = { tag: v.tag, attrs: {}, on: {}, kids: [] };
    update(el, v);
    return el;
  }
  function setAttr(el, k, val) {
    if (val == null || val === false) { el.removeAttribute(k); return; }
    if (k === 'class') k = 'class';
    el.setAttribute(k, val === true ? '' : String(val));
  }
  function update(el, v) {
    var old = el.__v || { attrs: {}, on: {}, kids: [] };
    for (var k in v.attrs) if (old.attrs[k] !== v.attrs[k]) setAttr(el, k, v.attrs[k]);
    for (var k2 in old.attrs) if (!(k2 in v.attrs)) el.removeAttribute(k2);
    for (var e in v.on) el['on' + e] = typeof v.on[e] === 'function' ? v.on[e] : null;
    for (var e2 in old.on) if (!(e2 in v.on)) el['on' + e2] = null;
    patchKids(el, v.kids);
    el.__v = { tag: v.tag, attrs: v.attrs, on: v.on, kids: v.kids };
  }
  function patchKids(el, kids) {
    var cur = el.childNodes;
    for (var i = 0; i < kids.length; i++) {
      var nv = kids[i], ex = cur[i];
      if (!ex) { el.appendChild(create(nv)); continue; }
      var ov = ex.__v;
      if (nv.text != null) {
        if (ex.nodeType === 3) { if (ex.nodeValue !== nv.text) ex.nodeValue = nv.text; ex.__v = nv; }
        else el.replaceChild(create(nv), ex);
      } else if (ex.nodeType === 1 && ov && ov.tag === nv.tag) update(ex, nv);
      else el.replaceChild(create(nv), ex);
    }
    while (el.childNodes.length > kids.length) el.removeChild(el.lastChild);
  }

  window.DCLogic = function DCLogic(props) { this.props = props || {}; this.state = {}; };
  window.DCLogic.prototype.setState = function (o) {
    Object.assign(this.state, typeof o === 'function' ? o(this.state) : o);
    if (this.__schedule) this.__schedule();
  };
  window.DCLogic.prototype.forceUpdate = function () { if (this.__schedule) this.__schedule(); };

  window.mountFilm = function (Component, tplId, mountId, props) {
    var tpl = document.getElementById(tplId), root = document.getElementById(mountId);
    var comp = new Component(props || {}), queued = false;
    var render = function () {
      queued = false;
      var vals = comp.renderVals(), vnodes = [];
      kidsOf(tpl).forEach(function (n) { vnodes.push.apply(vnodes, build(n, vals, false)); });
      patchKids(root, vnodes.filter(function (v) { return v.text == null || /\S/.test(v.text); }));
    };
    comp.__schedule = function () { if (!queued) { queued = true; requestAnimationFrame(render); } };
    render();
    if (comp.componentDidMount) comp.componentDidMount();
    return comp;
  };
})();

class Component extends DCLogic {
  constructor(props) {
    super(props);

, "tones": [null, null, null, null, null], "bold": []}, {"c": ["never", "[0, 0, 1, 0]", "1", "0.5", "…"], "hl": false, "tones": [null, null, null, null, null], "bold": []}, {"c": ["be", "[1, 0, 0, 0]", "1", "0.5", "…"], "hl": false, "tones": [null, null, null, null, null], "bold": []}, {"c": ["perfect", "[1, 0, 0, 1]", "2", "1", "…"], "hl": false, "tones": [null, null, null, null, null], "bold": []}]}}}, {"cap": "Softmax turns the scores into weights that sum to 1. Here “law” gets the largest share.", "src": "§3.2.1", "set": {"tb": {"rows": [{"c": ["The", "[0, 1, 0, 0]", "0", "0", "0.06"], "hl": false, "tones": [null, null, null, null, "acc"], "bold": [4]}, {"c": ["law", "[1, 0, 2, 1]", "4", "2", "0.46"], "hl": true, "tones": [null, null, null, null, "acc"], "bold": [4]}, {"c": ["will", "[0, 1, 0, 1]", "1", "0.5", "0.10"], "hl": false, "tones": [null, null, null, null, "acc"], "bold": [4]}, {"c": ["never", "[0, 0, 1, 0]", "1", "0.5", "0.10"], "hl": false, "tones": [null, null, null, null, "acc"], "bold": [4]}, {"c": ["be", "[1, 0, 0, 0]", "1", "0.5", "0.10"], "hl": false, "tones": [null, null, null, null, "acc"], "bold": [4]}, {"c": ["perfect", "[1, 0, 0, 1]", "2", "1", "0.17"], "hl": false, "tones": [null, null, null, null, "acc"], "bold": [4]}]}}}, {"cap": "The output for “perfect” is the weighted sum of all values. All 6 words do this at once, as one matrix product: the paper’s Equation 1.", "src": "§3.2.1, Eq. 1", "set": {"vt": {"op": 1}, "out": {"op": 1}, "eq": {"op": 1}}}]}, {"title": "Step 4 · Eight heads, then join them", "actors": [{"id": "hd", "type": "tokens", "x": 93, "y": 160, "words": ["head 1", "head 2", "head 3", "head 4", "head 5", "head 6", "head 7", "head 8"], "tw": 128, "th": 40, "gap": 10, "fs": 15, "subs": ["64 numbers", "64 numbers", "64 numbers", "64 numbers", "64 numbers", "64 numbers", "64 numbers", "64 numbers"], "on": [0, 1, 2, 3, 4, 5, 6, 7]}, {"id": "cc", "type": "text", "x": 290, "y": 244, "w": 700, "text": "Concat(head₁ … head₈) · Wᴼ mono"}, {"id": "eo", "type": "heat", "x": 48, "y": 196, "rows": ["The", "law", "will", "never", "be", "perfect"], "cols": [], "w": [[0.24, 0.54, 0.37, 0.6, 0.63, 0.07, 0.01, 0.84], [0.26, 0.23, 1.0, 0.47, 0.84, 0.48, 0.64, 0.15], [0.63, 0.87, 0.52, 0.74, 0.67, 0.06, 0.76, 0.59], [0.3, 0.03, 0.87, 0.47, 0.72, 0.88, 0.71, 0.92], [0.39, 0.8, 0.44, 0.94, 0.88, 0.1, 0.14, 0.22], [0.97, 0.44, 0.63, 0.3, 0.51, 0.39, 0.35, 0.59]], "cs": 18, "lw": 80, "lfs": 12}, {"id": "st", "type": "tokens", "x": 600, "y": 530, "words": ["⟨s⟩"], "tw": 80, "th": 36, "fs": 15}, {"id": "c1", "type": "card", "x": 520, "y": 470, "w": 300, "h": 32, "icon": "eye", "label": "Masked self-attention"}, {"id": "c2", "type": "card", "x": 520, "y": 410, "w": 300, "h": 32, "icon": "eye", "label": "Encoder–decoder attention"}, {"id": "c3", "type": "card", "x": 520, "y": 350, "w": 300, "h": 32, "icon": "net", "label": "Feed-forward  (× 6 layers)"}, {"id": "c4", "type": "card", "x": 520, "y": 290, "w": 300, "h": 32, "icon": "dot", "label": "Linear → a score per word"}, {"id": "c5", "type": "card", "x": 520, "y": 230, "w": 300, "h": 32, "icon": "dot", "label": "Softmax → probabilities"}, {"id": "ot", "type": "tokens", "x": 620, "y": 166, "words": ["Das"], "tw": 80, "th": 36, "fs": 15, "on": [0], "op": 0}, {"id": "bx", "type": "beam", "x": 0, "y": 0, "pts": "276,250 420,250 420,427 516,427", "label": "keys, values", "lfs": 12, "lx": 420, "ly": 330, "op": 0}, {"id": "bo", "type": "beam", "x": 0, "y": 0, "pts": "660,226 660,206", "op": 0}, {"id": "nt", "type": "text", "x": 860, "y": 230, "w": 370, "text": "Vocabulary: about 37,000 shared sub-word tokens (English–German)", "fs": 15, "tone": "muted", "op": 0}, {"id": "bm", "type": "text", "x": 860, "y": 470, "w": 370, "text": "The paper keeps the 4 best partial translations (beam search), not only the top word.", "fs": 16, "box": "plain", "op": 0}], "beats": [{"cap": "Writing starts with a start token, ⟨s⟩. It gets an embedding and a position signal, like the English words did.", "src": "§3.1, §3.4", "set": {"c1": {"on": false}}}, {"cap": "Masked self-attention: a position may look only at itself and earlier outputs. Right now that is just ⟨s⟩.", "src": "§3.2.3", "set": {"c1": {"on": true}}}, {"cap": "Encoder–decoder attention: the queries come from the decoder; the keys and values come from the encoder’s output for all 6 English words.", "src": "§3.2.3", "set": {"c1": {"on": false}, "c2": {"on": true}, "bx": {"op": 1}}}, {"cap": "After the feed-forward network and 6 layers, a linear layer scores every vocabulary token, and softmax turns the scores into probabilities.", "src": "§3.3, §3.4, §5.1", "set": {"c2": {"on": false}, "c4": {"on": true}, "c5": {"on": true}, "nt": {"op": 1}}}, {"cap": "The most likely word is written, here “Das”, and fed back in for the next step. Our example translation shows whole words.", "src": "§3.1, §6.1", "set": {"c4": {"on": false}, "c5": {"on": false}, "ot": {"op": 1}, "bo": {"op": 1}, "bm": {"op": 1}}}]}, {"title": "Step 7 · Training the decoder: the mask", "actors": [{"id": "lm", "type": "text", "x": 60, "y": 150, "w": 400, "text": "Who may look at whom", "fs": 17, "fw": 600}, {"id": "mk", "type": "heat", "x": 60, "y": 180, "rows": ["Das", "Gesetz", "wird", "niemals", "perfekt", "sein"], "cols": ["Das", "Gesetz", "wird", "niemals", "perfekt", "sein"], "w": [[0.3, 0.3, 0.3, 0.3, 0.3, 0.3], [0.3, 0.3, 0.3, 0.3, 0.3, 0.3], [0.3, 0.3, 0.3, 0.3, 0.3, 0.3], [0.3, 0.3, 0.3, 0.3, 0.3, 0.3], [0.3, 0.3, 0.3, 0.3, 0.3, 0.3], [0.3, 0.3, 0.3, 0.3, 0.3, 0.3]], "cs": 44, "lw": 82, "top": 24, "lfs": 12}, {"id": "l1", "type": "text", "x": 600, "y": 166, "w": 600, "text": "input: the answer, shifted right", "fs": 15, "tone": "muted", "font": "mono"}, {"id": "t1", "type": "tokens", "x": 600, "y": 192, "words": ["⟨s⟩", "Das", "Gesetz", "wird", "niemals", "perfekt"], "tw": 92, "th": 42, "gap": 8, "fs": 15}, {"id": "v0", "type": "beam", "x": 0, "y": 0, "pts": "646,238 646,286", "tone": "muted"}, {"id": "v1", "ty o", "op": 0}, {"id": "ax", "type": "text", "x": 600, "y": 540, "w": 140, "text": "100K steps", "fs": 13, "tone": "muted", "font": "mono", "op": 0}, {"id": "rg", "type": "list", "x": 800, "y": 340, "w": 430, "upto": 0, "stagger": true, "fs": 19, "sfs": 15, "tfw": 600, "gap": 16, "items": [{"t": "Dropout 0.1", "s": "Without it: 24.6 instead of 25.8 BLEU."}, {"t": "Label smoothing 0.1", "s": "Worse perplexity, but better BLEU."}, {"t": "Average the last checkpoints", "s": "5 for the base model, 20 for the big one."}]}], "beats": [{"cap": "Data and hardware: 4.5M English–German sentence pairs, and one machine with 8 GPUs.", "src": "§5.1, §5.2"}, {"cap": "The learning rate rises for 4,000 steps, then falls slowly. This warm-up keeps the start of training stable.", "src": "§5.3", "set": {"lp": {"op": 1}, "pl": {"op": 1}, "pk": {"op": 1}, "ax": {"op": 1}}}, {"cap": "Dropout and label smoothing stop overfitting. The final model averages the last few checkpoints.", "src": "§5.4, §6.1", "set": {"rg": {"upto": 3}}, "read": 3}]}]}, {"n": "04", "name": "Evidence", "short": "Evidence", "lede": "Four tests. Each one checks one claim.", "scenes": [{"title": "How they tested it", "actors": [{"id": "tb", "type": "table", "x": 48, "y": 160, "w": 1184, "fs": 18, "hfs": 15, "rpad": 13, "upto": 0, "ghost": true, "cols": "1fr 1.3fr 2fr 1.5fr", "head": ["Test", "Question", "How they measured", "Result"], "rows": [{"c": ["Translation", "Is it better than the best systems?", "BLEU on the WMT 2014 English→German and English→French test sets", "28.4 and 41.8 BLEU: new records"], "tones": [null, null, null, "acc"], "bold": [3]}, {"c": ["Training cost", "Is it cheaper to train?", "Training FLOPs, estimated from time × GPUs × GPU speed", "base model: least compute of all"], "tones": [null, null, null, "acc"], "bold": [3]}, {"c": ["Ablations", "Which parts matter?", "Change one setting of the base model; BLEU on the dev set", "heads, size and dropout matter"], "tones": [null, null, null, "acc"], "  "hl": false}, {"n": "MoE", "v": 40.56, "l": "40.56", "hl": false}, {"n": "GNMT + RL ensemble", "v": 41.16, "l": "41.16", "hl": false}, {"n": "ConvS2S ensemble", "v": 41.29, "l": "41.29", "hl": false}, {"n": "Transformer, big", "v": 41.8, "l": "41.8", "hl": true}], "op": 0.25}], "beats": [{"cap": "English→German: the big Transformer scores 28.4 BLEU, over 2 points above the best ensemble. Even the base model beats everything listed.", "src": "Table 2", "set": {"de": {"upto": 8}}, "read": 3}, {"cap": "English→French: the big model sets a single-model record, 41.8 BLEU. Here the base model trails the other single models.", "src": "Table 2", "set": {"fr": {"upto": 9, "op": 1}}, "read": 3}]}, {"title": "Training cost: a fraction of the compute", "actors": [{"id": "b", "type": "bars", "x": 48, "y": 160, "w": 760, "title": "Training compute, English→German (FLOPs)", "sub": "log scale, estimated; lower is better", "lw": 200, "vw": 110, "fs": 16, "bh": 20, "gap": 8, "max": 2.4, "upto": 0, "rows": [{"n": "Transformer, base", "v": 0.519, "l": "3.3·10¹⁸", "hl": true}, {"n": "ConvS2S", "v": 0.982, "l": "9.6·10¹⁸", "hl": false}, {"n": "MoE", "v": 1.301, "l": "2.0·10¹⁹", "hl": false}, {"n": "GNMT + RL", "v": 1.362, "l": "2.3·10¹⁹", "hl": false}, {"n": "Transformer, big", "v": 1.362, "l": "2.3·10¹⁹", "hl": true}, {"n": "ConvS2S ensemble", "v": 1.886, "l": "7.7·10¹⁹", "hl": false}, {"n": "GNMT + RL ensemble", "v": 2.255, "l": "1.8·10²⁰", "hl": false}]}, {"id": "s", "type": "stat", "x": 880, "y": 180, "w": 340, "v": "55×", "l": "less compute than the GNMT + RL ensemble, for the base model (our arithmetic)", "op": 0, "on": true}], "beats": [{"cap": "They estimate training compute from training time, number of GPUs and GPU speed.", "src": "§6.1, Table 2", "set": {"b": {"upto": 7}}, "read": 3}, {"cap": "The base model needed less compute than any system listed, and still beat all of them on English→German.", "src": "Table 2", "set": {"s": {"op": 1}}}]}, {"title": "Ablations: which parts matter", "actors": [{"id": "a1", "type": "bars", "x": 48, "y": 150, "w": 560, "title": "Attention heads", "sub": "", "lw": 100, "vw": 50, "fs": 14, "tfs": 16, "bh": 13, "gap": 4, "max": 3.2, "upto": 0, "rows": [{"n": "1 head", "v": 1.9, "l": "24.9", "hl": false}, {"n": "4 heads", "v": 2.5, "l": "25.5", "hl": false}, {"n": "8 heads", "v": 2.8, "l": "25.8", "hl": true}, {"n": "16 heads", "v": 2.8, "l": "25.8", "hl": false}, {"n": "32 heads", "v": 2.4, "l": "25.4", "hl": false}]}, {"id": "a2", "type": "bars", "x": 672, "y": 150, "w": 560, "title": "Layers per stack", "sub": "", "lw": 100, "vw": 50, "fs": 14, "tfs": 16, "bh": 13, "gap": 4, "max": 3.2, "upto": 0, "rows": [{"n": "2", "v": 0.7, "l": "23.7", "hl": false}, {"n": "4", "v": 2.3, "l": "25.3", "hl": false}, {"n": "6", "v": 2.8, "l": "25.8", "hl": true}, {"n": "8", "v": 2.5, "l": "25.5", "hl": false}]}, {"id": "a3", "type": "bars", "x": 48, "y": 360, "w": 560, "title": "Vector width", "sub": "", "lw": 100, "vw": 50, "fs": 14, "tfs": 16, "bh": 13, "gap": 4, "max": 3.2, "upto": 0, "rows": [{"n": "256", "v": 1.5, "l": "24.5", "hl": false}, {"n": "512", "v": 2.8, "l": "25.8", "hl": true}, {"n": "1024", "v": 3.0, "l": "26.0", "hl": false}]}, {"id": "a4", "type": "bars", "x": 672, "y": 360, "w": 560, "title": "Dropout and positions", "sub": "", "lw": 100, "vw": 50, "fs": 14, "tfs": 16, "bh": 13, "gap": 4, "max": 3.2, "upto": 0, "rows": [{"n": "no dropout", "v": 1.6, "l": "24.6", "hl": false}, {"n": "dropout 0.1", "v": 2.8, "l": "25.8", "hl": true}, {"n": "dropout 0.2", "v": 2.5, "l": "25.5", "hl": false}, {"n": "learned pos.", "v": 2.7, "l": "25.7", "hl": false}]}, {"id": "n", "type": "text", "x": 48, "y": 548, "w": 900, "text": "dev-set BLEU · bars start at 23 · base model = 25.8", "fs": 14, "tone": "muted", "font": "mono"}], "beats": [{"cap": "They change one setting at a time from the base model, which scores 25.8 BLEU on the development set.", "src": "Table 3, §6.2", "set": {"a1": {"upto": 5}, "a2": {"upto": 4}, "a3": {"upto": 3}, "a4": {"upto": 4}}, "read": 3}, {"cap": "One head or only 2 layers hurt. Wider helps a little. No dropout hurts. The position method barely matters.", "src": "Table 3", "read": 3}]}, {"title": "Beyond translation: parsing", "actors": [{"id": "tb", "type": "table", "x": 120, "y": 165, "w": 1040, "fs": 19, "hfs": 15, "rpad": 12, "upto": 0, "ghost": true, "cols": "1.6fr 1.6fr 0.5fr", "align": ["left", "left", "right"], "mono": [2], "head": ["Parser", "Training data", "F1"], "rows": [{"c": ["Petrov et al. (2006)", "WSJ only", "90.4"]}, {"c": ["Dyer et al. (2016)", "WSJ only", "91.7"]}, {"c": ["Transformer, 4 layers", "WSJ only, about 40K sentences", "91.3"], "hl": true}, {"c": ["Vinyals & Kaiser et al. (2014)", "semi-supervised", "92.1"]}, {"c": ["Transformer, 4 layers", "semi-supervised, about 17M sentences", "92.7"], "hl": true}, {"c": ["Dyer et al. (2016)", "generative", "93.3"]}]}], "beats": [{"cap": "They also try English parsing: turning a sentence into its grammar tree. F1 is the score; higher is better.", "src": "§6.3, Table 4", "set": {"tb": {"upto": 3}}, "read": 3}, {"cap": "With little tuning, a 4-layer Transformer is competitive. Two specialised parsers still score higher.", "src": "Table 4", "set": {"tb": {"upto": 6}}, "read": 3}]}]}, {"n": "05", "name": "Using it", "short": "Using it", "lede": "Is it for you? Three ways to use it, the settings, and what breaks.", "scenes": [{"title": "Is it for you?", "actors": [{"id": "use", "type": "list", "x": 48, "y": 165, "w": 560, "upto": 0, "stagger": true, "fs": 20, "gap": 20, "mark": "check", "mk": 30, "title": "Use it when", "ttone": "ok", "tfs": 18, "items": [{"t": "Your data is a sequence (text, code, logs, events) and links between distant items matter."}, {"t": "You can train on GPUs. The design trades step-by-step work for parallel work."}, {"t": "Sequences are short to medium. Attention is cheap while length stays below the vector width."}]}, {"id": "skip", "type": "list", "x": 672, "y": 165, "w": 560, "upto": 0, "stagger": true, "fs": 20, "gap": 20, "mark": "cross", "mk": 30, "title": "Skip it, or adapt it, when", "ttone": "bad", "tfs": 18, "items": [{"t": "Inputs run to tens of thousands of tokens. Cost grows with the square of length."}, {"t": "You need fast word-by-word output on small hardware. Generation is still one token at a time."}, {"t": "Your dataset is small. Start from a pretrained model instead of training from scratch."}]}], "beats": [{"cap": "Use it when your data is a sequence and distant items depend on each other.", "src": "§1, §4", "set": {"use": {"upto": 3}}, "read": 3}, {"cap": "Adapt it when inputs are very long, hardware is small, or data is scarce.", "src": "Table 1, §7", "set": {"skip": {"upto": 3}}, "read": 3}]}, {"title": "Three ways to use it", "actors": [{"id": "p1t", "type": "text", "x": 48, "y": 162, "w": 380, "text": "Adopt a pretrained model", "fs": 22, "fw": 600, "op": 0.2}, {"id": "p1w", "type": "text", "x": 48, "y": 196, "w": 380, "text": "You need translation, summarizing, search or classification.", "fs": 16, "tone": "muted", "op": 0.2}, {"id": "p1", "type": "list", "x": 48, "y": 250, "w": 380, "upto": 0, "ghost": true, "stagger": true, "fs": 18, "gap": 16, "mk": 28, "mfs": 14, "items": [{"t": "Pick a pretrained encoder–decoder (input → output) or decoder-only model."}, {"t": "Fine-tune it on your labelled examples."}, {"t": "Serve it with a key-value cache and beam search."}]}, {"id": "p2t", "type": "text", "x": 450, "y": 162, "w": 380, "text": "Build or change one", "fs": 22, "fw": 600, "op": 0.2}, {"id": "p2w", "type": "text", "x": 450, "y": 196, "w": 380, "text": "You do research or infra work and need control.", "fs": 16, "tone": "muted", "op": 0.2}, {"id": "p2", "type": "list", "x": 450, "y": 250, "w": 380, "upto": 0, "ghost": true, "stagger": true, "fs": 18, "gap": 16, "mk": 28, "mfs": 14, "items": [{"t": "Start from the base setup: 6 layers, 512 wide, 8 heads."}, {"t": "Train with warm-up, dropout 0.1 and label smoothing 0.1."}, {"t": "Test the decoder mask before the first long run."}, {"t": "Average the last checkpoints before you evaluate."}]}, {"id": "p3t", "type": "text", "x": 852, "y": 162, "w": 380, "text": "Borrow the idea", "fs": 22, "fw": 600, "op": 0.2}, {"id": "p3w", "type": "text", "x": 852, "y": 196, "w": 380, "text": "Your system is a chain of steps that each wait for the last.", "fs": 16, "tone": "muted", "op": 0.2}, {"id": "p3", "type": "list", "x": 852, "y": 250, "w": 380, "upto": 0, "ghost": true, "stagger": true, "fs": 18, "gap": 16, "mk": 28, "mfs": 14, "items": [{"t": "Find the dependency that forces the order."}, {"t": "Let every item see every other item directly."}, {"t": "Add back only what you lost, such as order."}]}], "beats": [{"cap": "Path 1, for most teams: adopt a pretrained model and fine-tune it.", "kind": "ours", "set": {"p1t": {"op": 1}, "p1w": {"op": 1}, "p1": {"upto": 3}}, "read": 2}, {"cap": "Path 2: build or change one. Start from the paper’s base setup and its training recipe.", "src": "§3, §5", "set": {"p2t": {"op": 1}, "p2w": {"op": 1}, "p2": {"upto": 4}}, "read": 3}, {"cap": "Path 3: borrow only the idea. Remove the chain, then add back what you lost.", "kind": "ours", "set": {"p3t": {"op": 1}, "p3w": {"op": 1}, "p3": {"upto": 3}}, "read": 2}]}, {"title": "Settings that matter", "actors": [{"id": "tb", "type": "table", "x": 48, "y": 155, "w": 1184, "fs": 18, "hfs": 15, "rpad": 10, "upto": 0, "ghost": true, "cols": "1.3fr 1fr 2.4fr 0.8fr", "head": ["Setting", "Paper default", "If you change it", "Source"], "rows": [{"c": ["Heads", "8", "1 head: −0.9 BLEU. 32 heads: −0.4.", "Table 3"]}, {"c": ["Layers per stack", "6", "2 layers: −2.1 BLEU. 8 layers: no gain.", "Table 3"]}, {"c": ["Vector width", "512", "1024: +0.2 BLEU for 2.6× the parameters.", "Table 3"]}, {"c": ["Feed-forward width", "2048", "4096: +0.4 BLEU.", "Table 3"]}, {"c": ["Dropout", "0.1", "None: −1.2 BLEU.", "Table 3"]}, {"c": ["Label smoothing", "0.1", "Non         return v;
      }
      v.x = st.x || 0; v.y = DY + (st.y || 0); v.s = st.s || 1; v.w = st.w || 400;
      var upto = st.upto == null ? 999 : st.upto;

    var curSc = cur.sc;

    var speeds = [0.75, 1, 1.25, 1.5, 2, 3, 4];

        return { name: (c.n ? c.n + ' ' : '') + c.name, w: (b - a).toFixed(1), pick: function () { self._go(F.chStart[ci]); } };
      }),

      speeds: speeds.map(function (v) { var on = S.speed === v; return { l: v + '×', fw: on ? 600 : 400, bg: on ? rgba(0.1) : 'transparent', fg: on ? accent : t.ink, pick: function () { self._setSpeed(v); } }; })
